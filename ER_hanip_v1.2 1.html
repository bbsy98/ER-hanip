<title>ER 한입 — 응급실 간호사 데일리 퀴즈</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#14181f; --sub:#5b6472; --line:#e3e7ec;
  --pri:#0f766e; --pri2:#14b8a6; --priSoft:#e6f6f4;
  --ok:#16a34a; --okSoft:#e8f7ee; --bad:#dc2626; --badSoft:#fdecec; --warn:#d97706;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --sub:#9aa5b1; --line:#2a313b;
  --pri:#2dd4bf; --pri2:#14b8a6; --priSoft:#10302c;
  --ok:#3fb950; --okSoft:#12261a; --bad:#f87171; --badSoft:#2c1515; --warn:#f0b04a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.55;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px;display:flex;gap:8px;align-items:center}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
h1{font-size:22px;margin:4px 0 6px;letter-spacing:-.4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--sub);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:16px;cursor:pointer;background:var(--pri);color:#fff;transition:transform .06s,opacity .15s}
[data-theme="dark"] .btn{color:#06201d}
.btn:active{transform:scale(.985)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--priSoft);color:var(--pri)}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px;width:auto}
.row{display:flex;gap:10px} .row>*{flex:1}
.field{margin-bottom:12px} .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.input:focus{border-color:var(--pri)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0}
.hero{background:linear-gradient(135deg,var(--pri),#115e59);color:#fff;border:0}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#115e59,#0b3f3b)}
.hero .sub{color:rgba(255,255,255,.82)}
.hero .btn{background:#fff;color:#0f766e}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex:0 0 74px}
.ring>div{width:58px;height:58px;border-radius:50%;background:#0f766e;display:grid;place-items:center;font-weight:800;font-size:15px}
[data-theme="dark"] .ring>div{background:#0e4c47}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px} .stat span{font-size:12px;color:var(--sub)}
.week{display:flex;justify-content:space-between;margin-top:6px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.week .c{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.week .c.on{background:var(--pri);border-color:var(--pri);color:#fff}
[data-theme="dark"] .week .c.on,[data-theme="dark"] .opt.sel .k,[data-theme="dark"] .opt.right .k,[data-theme="dark"] .opt.wrong .k{color:#0d1117}
.week .c.part{border-color:var(--pri);color:var(--pri)}
.week .c.today{outline:2px dashed var(--pri);outline-offset:2px}
.tip{background:var(--priSoft);border-radius:12px;padding:12px 14px;font-size:14px}
.qtop{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.x{border:0;background:transparent;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--sub)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .35s}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.lv{font-size:12px;color:var(--sub);margin-left:6px}
.qtext{font-size:18px;font-weight:650;margin:12px 0 16px;line-height:1.6}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;font-size:15.5px;transition:border-color .12s,background .12s}
.opt .k{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.opt.sel{border-color:var(--pri);background:var(--priSoft)}
.opt.sel .k{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okSoft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt.sq .k{border-radius:6px}
.numwrap{display:flex;gap:8px;align-items:center}
.numwrap .input{font-size:20px;font-weight:700;text-align:right}
.unit{font-weight:700;color:var(--sub);min-width:56px}
.ecgbox{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff7f7}
.ecgbox svg{display:block;width:100%;height:130px}
.ecgbox .gs{stroke:#f6c9c9;stroke-width:.5}.ecgbox .gl{stroke:#eb9a9a;stroke-width:.9}
.ecgbox .ew{fill:none;stroke:#111;stroke-width:1.6;stroke-linejoin:round}
.ecgcap{font-size:11px;color:#8a5a5a;padding:3px 8px;background:#fff0f0}
[data-theme="dark"] .ecgbox{background:#0b1a12}[data-theme="dark"] .ecgbox .gs{stroke:#173524}[data-theme="dark"] .ecgbox .gl{stroke:#21573a}
[data-theme="dark"] .ecgbox .ew{stroke:#4ade80}[data-theme="dark"] .ecgcap{background:#0e2418;color:#7fbf98}
.grouph{font-size:13px;font-weight:800;color:var(--sub);margin:14px 0 8px;letter-spacing:.2px}
.gtable{width:100%;border-collapse:collapse;font-size:13.5px}.gtable td{padding:6px 4px;border-bottom:1px solid var(--line)}.gtable td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}.steps li{position:relative;padding:0 0 12px 34px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
[data-theme="dark"] .steps li:before{color:#0d1117}
.fb{border-radius:16px;padding:16px;margin-top:6px;animation:up .22s ease-out}
.fb.fok{background:var(--okSoft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.fno{background:var(--badSoft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.fb .head{font-weight:800;font-size:17px;margin-bottom:6px}
.fb.fok .head{color:var(--ok)} .fb.fno .head{color:var(--bad)}
.fb .pt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.fb .src{margin-top:8px;font-size:12px;color:var(--sub)}
.linkbtn{background:none;border:0;color:var(--sub);font-size:13px;cursor:pointer;padding:6px 4px;text-decoration:underline}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--pri)}
.sticky{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
nav.tabs[hidden]{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--sub);cursor:pointer;font-weight:600}
nav.tabs button .i{font-size:20px;line-height:1.1;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--pri)} nav.tabs button.on .i{filter:none;opacity:1}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0} .li .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catbar{margin:10px 0}
.catbar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.catbar .b{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.catbar .b i{display:block;height:100%;border-radius:99px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--pri) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--pri) 65%,var(--line))}
.heat i.l3{background:var(--pri)}
.heat i.fut{background:transparent}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.seg.trk button{padding:11px 8px;font-size:15px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catbtn{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.catbtn .n{font-weight:700;font-size:14.5px} .catbtn .s{font-size:12px;color:var(--sub)}
.catbtn.off{opacity:.45}
.catbtn.pick{border-color:var(--pri);background:var(--priSoft)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s;max-width:90vw;text-align:center}
[data-theme="dark"] .toast{background:#e6edf3;color:#0d1117}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.small{font-size:12.5px;color:var(--sub)}
.center{text-align:center}
.big{font-size:44px;line-height:1}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--sub);font-weight:700}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.disc{font-size:12px;color:var(--sub);text-align:center;margin:18px 6px 6px;line-height:1.5}
</style>
</head>

<script>

const BANK = [
/* ───────── ACLS·BLS ───────── */
{id:"acls01",cat:"acls",lv:1,type:"mc",
 q:"성인 CPR 시 가슴압박의 깊이로 옳은 것은?",
 opts:["약 3~4cm","최소 5cm, 6cm를 넘지 않게","최소 7cm","흉곽 전후 직경의 1/2"],a:1,
 exp:"성인은 최소 5cm 깊이로 누르되 6cm를 넘기지 않는 것이 권고된다. 너무 얕으면 관류가 부족하고, 너무 깊으면 손상 위험이 커진다.",
 tip:"압박 후 흉벽이 완전히 올라오도록(완전 이완) 손을 가슴에 기대지 않는다.",src:"AHA 2025 BLS"},
{id:"acls02",cat:"acls",lv:1,type:"mc",
 q:"성인 CPR의 가슴압박 속도는?",
 opts:["분당 80~100회","분당 100~120회","분당 120~140회","분당 60회 이상"],a:1,
 exp:"분당 100~120회가 권고 속도다. 120회를 넘기면 깊이가 얕아지고 이완이 불충분해지기 쉽다.",
 tip:"교대 직후 첫 사이클은 속도가 빨라지기 쉬우니 메트로놈이나 피드백 장치를 활용한다.",src:"AHA 2025 BLS"},
{id:"acls03",cat:"acls",lv:1,type:"mc",
 q:"전문기도(기관내관 등)가 확보된 성인 심정지 환자의 인공호흡 방법은?",
 opts:["30:2로 압박을 멈추고 환기","15:2로 환기","압박을 멈추지 않고 6초마다 1회 환기","압박을 멈추지 않고 2초마다 1회 환기"],a:2,
 exp:"전문기도 확보 후에는 가슴압박을 중단하지 않고 6초마다 1회(분당 10회) 환기한다.",
 tip:"과환기는 흉강 내압을 높여 정맥환류와 관상동맥 관류를 떨어뜨린다. 백을 짜는 속도를 의식하자.",src:"AHA 2025 ACLS"},
{id:"acls04",cat:"acls",lv:1,type:"mc",
 q:"VF/무맥성 VT에서 첫 번째 Amiodarone 투여 용량은?",
 opts:["150mg IV","300mg IV bolus","1mg/kg IV","450mg IV"],a:1,
 exp:"충격 후에도 지속되는 VF/pVT에서 Amiodarone 첫 용량은 300mg IV/IO bolus, 두 번째는 150mg이다.",
 tip:"Amiodarone 대신 Lidocaine(첫 1~1.5mg/kg)을 쓸 수도 있다. 병원 크래시카트 구성을 미리 확인해 두자.",src:"AHA 2025 ACLS"},
{id:"acls05",cat:"acls",lv:1,type:"mc",
 q:"심정지 시 Epinephrine 1mg IV/IO의 반복 투여 간격은?",
 opts:["1~2분마다","3~5분마다","10분마다","1회만 투여"],a:1,
 exp:"Epinephrine 1mg은 3~5분마다 반복 투여한다. 리듬체크 주기가 2분이므로 '두 사이클마다' 투여하면 기억하기 쉽다.",
 tip:"기록 담당은 투약 시각을 큰 소리로 알리고, 다음 예정 시각을 미리 공유한다.",src:"AHA 2025 ACLS"},
{id:"acls06",cat:"acls",lv:2,type:"mc",
 q:"무수축(Asystole)/PEA 환자에서 Epinephrine 투여 시점으로 가장 적절한 것은?",
 opts:["2번째 제세동 후","가능한 한 빨리","Amiodarone 투여 후","10분간 CPR 후에도 반응 없을 때"],a:1,
 exp:"비충격성 리듬(Asystole/PEA)에서는 제세동 대상이 아니므로 Epinephrine을 가능한 한 빨리 투여한다.",
 tip:"PEA에서는 H's & T's(가역적 원인) 탐색이 핵심이다. 초음파, 혈당, 칼륨, 기흉 여부를 동시에 확인한다.",src:"AHA 2025 ACLS"},
{id:"acls07",cat:"acls",lv:1,type:"mc",
 q:"리듬 확인 및 맥박 확인을 위해 가슴압박을 중단하는 시간은?",
 opts:["5초 이내","10초 이내","20초 이내","30초 이내"],a:1,
 exp:"압박 중단은 10초 이내로 최소화한다. 압박 중단 시간이 길어질수록 관상동맥 관류압이 급격히 떨어진다.",
 tip:"제세동기 충전은 압박을 계속하면서 하고, 충격 직후 바로 압박을 재개한다.",src:"AHA 2025 BLS/ACLS"},
{id:"acls08",cat:"acls",lv:2,type:"mc",
 q:"심정지의 가역적 원인(H's & T's)에 해당하지 않는 것은?",
 opts:["저산소증","긴장성 기흉","심장눌림증(Tamponade)","고혈당"],a:3,
 exp:"H's는 저혈량, 저산소증, 산증(H+), 저/고칼륨혈증, 저체온, T's는 긴장성 기흉, 심장눌림증, 독성물질, 혈전증(폐/관상동맥)이다. 고혈당은 포함되지 않는다.",
 tip:"코드 중에는 '지금 배제한 원인'을 리더에게 짧게 보고하면 팀 전체의 시야가 넓어진다.",src:"AHA 2025 ACLS"},
{id:"acls09",cat:"acls",lv:2,type:"mc",
 q:"자발순환회복(ROSC) 직후 산소화 목표 SpO₂로 가장 적절한 것은? (AHA 2025)",
 opts:["100% 유지","90~98%","85~90%","80% 이상이면 충분"],a:1,
 exp:"AHA 2025 소생 후 관리 알고리즘은 FiO₂를 조절해 SpO₂ 90~98%(또는 PaO₂ 60~105mmHg)를 목표로 한다. 과산소증도 해로울 수 있다.",
 tip:"ROSC 직후 100% 산소로 시작했다면 SpO₂를 보면서 FiO₂를 낮추는 것을 잊지 말자.",src:"AHA 2025 Post-Cardiac Arrest Care"},
{id:"acls10",cat:"acls",lv:2,type:"mc",
 q:"ROSC 후 혈역학 목표로 AHA 2025 알고리즘이 제시하는 것은?",
 opts:["MAP ≥ 65mmHg","SBP ≥ 140mmHg","MAP ≥ 100mmHg","HR ≤ 60회/분"],a:0,
 exp:"수액과 승압제를 조절하여 평균동맥압(MAP) 65mmHg 이상을 목표로 한다.",
 tip:"ROSC 후 12-lead ECG를 빨리 찍어 STEMI 여부를 확인한다. 관상동맥 중재술 결정에 직결된다.",src:"AHA 2025 Post-Cardiac Arrest Care"},
{id:"acls11",cat:"acls",lv:2,type:"mc",
 q:"증상이 있는 서맥(저혈압, 의식변화 동반) 성인에서 Atropine 용법으로 옳은 것은?",
 opts:["0.5mg IV, 최대 3mg","1mg IV, 3~5분마다, 최대 총 3mg","2mg IV 1회","1mg IV, 1분마다, 제한 없음"],a:1,
 exp:"AHA 2025 서맥 알고리즘에서 Atropine은 1mg bolus로 시작하고 3~5분마다 반복하며 최대 총량은 3mg이다.",
 tip:"Atropine이 효과 없으면 경피적 심박조율(TCP) 또는 Dopamine/Epinephrine 지속주입으로 넘어간다. 패드를 미리 붙여두자.",src:"AHA 2025 ACLS Bradycardia"},
{id:"acls12",cat:"acls",lv:3,type:"mc",
 q:"Atropine의 효과를 기대하기 어려워 조기에 심박조율을 고려해야 하는 리듬은?",
 opts:["동서맥(Sinus bradycardia)","1도 방실차단","Mobitz II 2도 방실차단","Mobitz I(Wenckebach)"],a:2,
 exp:"Mobitz II와 3도 방실차단(특히 넓은 QRS)은 차단 부위가 His 속 이하인 경우가 많아 Atropine 반응이 떨어진다. 심박조율을 일찍 준비한다.",
 tip:"심장이식 환자도 미주신경이 끊겨 있어 Atropine이 잘 듣지 않는다.",src:"AHA 2025 ACLS Bradycardia"},
{id:"acls13",cat:"acls",lv:2,type:"mc",
 q:"맥박이 있는 안정적인 규칙적 좁은 QRS 빈맥(SVT)에서 미주신경 자극 후에도 지속될 때 첫 약물은?",
 opts:["Adenosine 6mg 급속 IV","Amiodarone 300mg IV","Epinephrine 1mg IV","Atropine 1mg IV"],a:0,
 exp:"Adenosine 6mg을 급속 IV push하고, 효과가 없으면 12mg을 투여한다.",
 tip:"투약 전 환자에게 '잠깐 가슴이 답답하거나 멈추는 느낌이 들 수 있다'고 미리 알려주면 불안이 줄어든다.",src:"AHA 2025 ACLS Tachycardia"},
{id:"acls14",cat:"acls",lv:2,type:"mc",
 q:"Adenosine 투여 방법으로 가장 적절한 것은?",
 opts:["100mL에 희석해 15분간 주입","근위부 정맥에 급속 push 후 즉시 생리식염수 flush","근육주사","원위부 정맥에 천천히 2분간 push"],a:1,
 exp:"Adenosine은 반감기가 매우 짧아(수 초) 심장에 빨리 도달해야 한다. 가능한 근위부(전주와 등) 정맥에 급속 push 후 곧바로 생리식염수로 flush하고 팔을 올린다.",
 tip:"3-way 또는 주사기 2개를 연결해 '약물 → flush'를 끊김 없이 한 번에 밀어 넣는다. 투여 중 리듬 스트립을 기록한다.",src:"AHA 2025 ACLS Tachycardia"},
{id:"acls15",cat:"acls",lv:2,type:"mc",
 q:"맥박이 있으나 저혈압·의식저하를 동반한 불안정한 빈맥의 우선 처치는?",
 opts:["Adenosine 투여","동기화 심율동전환(Synchronized cardioversion)","비동기화 제세동","경과 관찰"],a:1,
 exp:"불안정한 빈맥(맥박 있음)에는 동기화 심율동전환을 시행한다. 의식이 있으면 가능한 범위에서 진정을 고려한다.",
 tip:"충격 후 제세동기가 동기화 모드에서 풀리는 기종이 많다. 추가 충격 전에 SYNC 표시를 다시 확인한다.",src:"AHA 2025 ACLS Tachycardia"},
{id:"acls16",cat:"acls",lv:3,type:"mc",
 q:"AHA 2025에서 심방세동/조동의 심율동전환 시 첫 충격 에너지로 선호되는 설정은?",
 opts:["50J 이하","100J","200J 이상","에너지와 무관"],a:2,
 exp:"AHA 2025 성인 ALS 지침은 심방세동·심방조동의 심율동전환에서 첫 충격을 낮은 에너지보다 200J 이상의 높은 에너지로 하는 것이 바람직하다고 제시한다.",
 tip:"실제 설정은 장비 제조사 권고와 병원 프로토콜을 따른다.",src:"AHA 2025 ACLS"},
{id:"acls17",cat:"acls",lv:2,type:"mc",
 q:"다형성 VT 중 QT 연장과 관련된 Torsades de pointes에 사용하는 약물은?",
 opts:["Magnesium sulfate","Adenosine","Diltiazem","Digoxin"],a:0,
 exp:"Torsades de pointes에는 Magnesium sulfate IV를 사용한다. 맥박이 없으면 제세동이 우선이다.",
 tip:"QT를 연장시키는 약물(일부 항생제, 항구토제, 항정신병약 등) 투여 이력을 함께 확인한다.",src:"AHA 2025 ACLS"},
{id:"acls18",cat:"acls",lv:2,type:"mc",
 q:"CPR 중 파형 호기말 이산화탄소(EtCO₂)가 갑자기 40mmHg 이상으로 상승했다. 가장 먼저 의심할 것은?",
 opts:["기관내관 위치 이탈","자발순환회복(ROSC)","과환기","압박의 질 저하"],a:1,
 exp:"EtCO₂의 급격하고 지속적인 상승은 폐혈류 회복, 즉 ROSC의 신호일 수 있다. 다음 리듬체크에서 맥박을 확인한다.",
 tip:"반대로 CPR 중 EtCO₂가 지속적으로 10mmHg 미만이면 압박 깊이·속도·교대를 점검한다.",src:"AHA ACLS"},
{id:"acls19",cat:"acls",lv:1,type:"mc",
 q:"가슴압박 시행자를 교대하는 권장 주기는?",
 opts:["1분마다","약 2분마다(리듬체크 시)","5분마다","지칠 때만"],a:1,
 exp:"피로로 압박 질이 떨어지기 전, 약 2분(리듬체크 시점)마다 교대한다. 교대는 5초 이내로 끝낸다.",
 tip:"다음 압박자는 미리 반대편에 대기하고 '교대 준비' 콜을 한다.",src:"AHA 2025 BLS"},

/* ───────── ECG ───────── */
{id:"ecg01",cat:"ecg",lv:1,type:"mc",
 q:"리듬 스트립: P파가 보이지 않고 RR 간격이 완전히 불규칙하며 기저선이 잔잔하게 흔들린다.",
 opts:["심방조동","심방세동","동성 부정맥","3도 방실차단"],a:1,
 exp:"뚜렷한 P파 없음 + 불규칙한 RR 간격(irregularly irregular)은 심방세동의 전형이다.",
 tip:"새로 발생한 AF는 발생 시각(48시간 이내 여부)을 꼭 확인한다. 항응고·심율동전환 결정에 쓰인다.",src:"ECG 기본"},
{id:"ecg02",cat:"ecg",lv:1,type:"mc",
 q:"리듬 스트립: II, III, aVF에서 톱니 모양의 규칙적인 파형이 보이고 심실박동수가 약 150회/분으로 규칙적이다.",
 opts:["심방세동","심방조동(2:1 전도)","동성 빈맥","심실빈맥"],a:1,
 exp:"톱니 모양(sawtooth) F파는 심방조동의 특징이다. 심방 약 300회/분이 2:1로 전도되면 심실 약 150회/분이 된다.",
 tip:"규칙적인 HR 150 근처의 좁은 QRS 빈맥이면 2:1 조동을 항상 감별에 넣자.",src:"ECG 기본"},
{id:"ecg03",cat:"ecg",lv:2,type:"mc",
 q:"PR 간격이 점점 길어지다가 QRS 하나가 빠진 뒤 다시 반복된다.",
 opts:["1도 방실차단","Mobitz I(Wenckebach)","Mobitz II","3도 방실차단"],a:1,
 exp:"PR이 점진적으로 연장되다 QRS가 탈락하는 패턴은 Mobitz I(Wenckebach)이다. 대개 방실결절 수준이며 상대적으로 양성인 경우가 많다.",
 tip:"PR이 일정하다가 갑자기 QRS가 빠지면 Mobitz II다. 이쪽이 더 위험하다.",src:"ECG 기본"},
{id:"ecg04",cat:"ecg",lv:2,type:"mc",
 q:"P파와 QRS가 각자 규칙적이지만 서로 관계없이 나타나며 심실박동수는 약 35회/분이다.",
 opts:["Mobitz I","Mobitz II","3도(완전) 방실차단","동정지"],a:2,
 exp:"방실해리(P와 QRS가 독립적)는 3도 완전 방실차단이다. 증상이 있으면 심박조율을 준비한다.",
 tip:"패드를 미리 붙이고 저혈압·의식변화를 계속 모니터링한다.",src:"ECG 기본"},
{id:"ecg05",cat:"ecg",lv:2,type:"mc",
 q:"II, III, aVF에서 ST 분절 상승이 보인다. 해당하는 심근경색 부위는?",
 opts:["전벽(Anterior)","측벽(Lateral)","하벽(Inferior)","후벽(Posterior)"],a:2,
 exp:"II, III, aVF는 하벽을 반영한다. 주로 우관상동맥(RCA) 폐색과 관련된다.",
 tip:"하벽 STEMI라면 우측 유도(V4R)를 추가로 찍어 우심실 경색을 확인한다.",src:"ECG 기본"},
{id:"ecg06",cat:"ecg",lv:3,type:"mc",
 q:"하벽 STEMI 환자에서 V4R ST 상승이 확인되었다(우심실 경색 의심). 주의해야 할 처치는?",
 opts:["산소 투여","Nitroglycerin 투여","12-lead 재검","정맥로 확보"],a:1,
 exp:"우심실 경색은 전부하에 크게 의존한다. Nitrate처럼 전부하를 떨어뜨리는 약물은 심한 저혈압을 일으킬 수 있어 주의한다.",
 tip:"저혈압이 오면 수액 볼루스가 도움이 되는 경우가 많다. 처방 전 의사와 상의한다.",src:"ACS 관리"},
{id:"ecg07",cat:"ecg",lv:1,type:"mc",
 q:"고칼륨혈증에서 가장 먼저 나타나는 전형적인 ECG 변화는?",
 opts:["U파","좁고 뾰족한 T파(peaked T)","ST 하강","delta파"],a:1,
 exp:"고칼륨혈증은 뾰족한 T파 → PR 연장·P파 소실 → QRS 넓어짐 → 사인파 → VF/무수축 순으로 진행할 수 있다.",
 tip:"투석 환자, ACEi/ARB·K 보존 이뇨제 복용자의 ECG에서 T파를 습관적으로 확인하자.",src:"ECG 기본"},
{id:"ecg08",cat:"ecg",lv:1,type:"mc",
 q:"저칼륨혈증에서 나타날 수 있는 ECG 소견은?",
 opts:["U파 출현","뾰족한 T파","넓은 QRS와 사인파","ST 상승"],a:0,

{id:"ecg09",cat:"ecg",lv:2,type:"mc",
 q:"넓은 QRS의 규칙적인 빈맥(HR 180)이 보이며 환자는 의식이 있고 혈압이 안정적이다. 가장 적절한 접근은?",
 opts:["즉시 비동기화 제세동","12-lead ECG 확보 후 전문가 상의 및 항부정맥제 고려","Atropine 투여","관찰만 한다"],a:1,
 exp:"안정적인 넓은 QRS 빈맥은 VT일 가능성을 우선 고려하며, 12-lead를 확보하고 전문가 상의 하에 약물 치료를 고려한다. 불안정해지면 동기화 심율동전환으로 전환한다.",
 tip:"넓은 QRS 빈맥은 확실하지 않으면 VT로 간주하는 것이 안전하다.",src:"AHA 2025 ACLS Tachycardia"},
{id:"ecg10",cat:"ecg",lv:2,type:"mc",

 opts:["즉시 제세동","환자 상태와 리드 연결(인공물) 확인","Amiodarone 투여","CPR 시작"],a:1,
 exp:"치료는 모니터가 아니라 환자를 본다. 환자가 반응하고 맥박이 있다면 움직임·떨림·전극 탈락 등 인공물(artifact)을 먼저 의심한다.",
 tip:"전극이 땀이나 털로 들뜨지 않았는지, 리드선이 당겨지지 않았는지 확인한다.",src:"ECG 기본"},

{id:"drug01",cat:"drug",lv:1,type:"mc",

 tip:"심정지가 아닌 환자에게 1mg IV push는 위험하다. 앰플 농도(1mg/mL vs 0.1mg/mL)를 반드시 다시 확인한다.",src:"아나필락시스 진료지침"},
{id:"drug02",cat:"drug",lv:2,type:"mc",

 exp:"저혈압, 최근 PDE-5 억제제 복용(약물에 따라 24~48시간), 우심실 경색은 NTG의 주요 주의/금기 상황이다. SpO₂ 95%는 금기가 아니다.",

{id:"drug03",cat:"drug",lv:1,type:"mc",

 tip:"투여 후 호전돼도 일정 시간 모니터링하고, 장기 사용자는 급성 금단 증상(흥분, 구토)이 올 수 있다.",src:"독성학 기본"},
{id:"drug04",cat:"drug",lv:2,type:"mc",

{id:"drug05",cat:"drug",lv:1,type:"mc",
 q:"고칼륨혈증으로 ECG 변화가 있을 때 심근 보호(막 안정화)를 위해 가장 먼저 투여하는 약물은?",
 opts:["Insulin + 포도당","Calcium gluconate(또는 chloride)","Furosemide","Kayexalate"],a:1,

 tip:"Calcium chloride는 조직 괴사 위험이 커서 가능하면 굵은(중심) 정맥로로 준다. 인슐린 투여 후에는 혈당을 반복 확인한다.",src:"전해질 응급"},
{id:"drug06",cat:"drug",lv:2,type:"mc",

 tip:"주입 속도와 농도 상한은 병원 고위험 약물 지침을 따르고, 이중 확인(double check)을 한다.",src:"고위험 약물 안전"},
{id:"drug07",cat:"drug",lv:2,type:"mc",
 q:"말초정맥으로 Norepinephrine 주입 중 혈관외유출(extravasation)이 발생했다. 해독제로 국소 투여할 수 있는 약물은?",
 opts:["Phentolamine","Hyaluronidase","Naloxone","Atropine"],a:0,
 exp:"혈관수축제 유출에는 α 차단제인 Phentolamine을 국소 침윤 투여해 허혈을 줄일 수 있다(처방에 따라).",
 tip:"즉시 주입을 중단하고, 바늘을 바로 빼지 말고 가능한 약물을 흡인한 후 보고한다. 이후 범위를 표시하고 관찰한다.",src:"승압제 간호"},
{id:"drug08",cat:"drug",lv:1,type:"mc",

 opts:["경구 당분 섭취","고농도 포도당(D50 등) IV","인슐린 투여","관찰 후 30분 뒤 재측정"],a:1,
 exp:"의식이 저하되어 경구 섭취가 불가능하면 고농도 포도당을 정맥 투여한다. 정맥로가 없으면 Glucagon 근주를 고려한다.",
 tip:"D50은 고삼투성이라 혈관 자극이 크다. 혈관외유출이 없는지 확인하며 투여하고 15분 후 혈당을 재측정한다.",src:"저혈당 관리"},
{id:"drug09",cat:"drug",lv:2,type:"mc",

 exp:"1차 약물은 Benzodiazepine(Lorazepam IV, Midazolam IM/IN 등)이다. 지속되면 2차 약물(Levetiracetam, Fosphenytoin, Valproate 등)로 넘어간다.",
 tip:"경련 시작 시각을 기록하고, 저혈당 여부를 즉시 확인한다. 투약 후 호흡억제를 모니터링한다.",src:"경련중첩증 지침"},
{id:"drug10",cat:"drug",lv:2,type:"mc",

 tip:"말초 투여 시 정맥염이 잘 생기므로 주입 부위를 자주 관찰한다.",src:"약리 기본"},
{id:"drug11",cat:"drug",lv:3,type:"mc",
 q:"급성 허혈성 뇌졸중 환자에게 정맥 혈전용해제를 투여하기 전 목표 혈압은?",

/* ───────── 약물 계산 ───────── */
{id:"calc01",cat:"calc",lv:2,type:"num",
 q:"Norepinephrine 4mg을 250mL에 혼합했다. 70kg 환자에게 0.1mcg/kg/min으로 주입하려면 주입 속도는? (mL/hr, 소수 첫째 자리)",
 a:26.3,tol:0.3,unit:"mL/hr",
 exp:"농도 = 4,000mcg ÷ 250mL = 16mcg/mL. 필요량 = 0.1 × 70 = 7mcg/min = 420mcg/hr. 속도 = 420 ÷ 16 = 26.25 ≈ 26.3mL/hr.",
 tip:"공식: mL/hr = (용량 mcg/kg/min × 체중 × 60) ÷ 농도(mcg/mL). 혼합 농도는 병원마다 다르니 라벨을 먼저 본다.",src:"약물 계산"},
{id:"calc02",cat:"calc",lv:2,type:"num",
 q:"Dopamine 400mg/250mL. 60kg 환자에게 5mcg/kg/min으로 주입할 때 속도는? (mL/hr)",
 a:11.25,tol:0.2,unit:"mL/hr",
 exp:"농도 = 400,000 ÷ 250 = 1,600mcg/mL. 5 × 60 × 60 = 18,000mcg/hr. 18,000 ÷ 1,600 = 11.25mL/hr.",
 tip:"펌프 소수점 입력 단위(0.1 vs 0.01)를 확인하고 반올림 규칙은 병원 기준을 따른다.",src:"약물 계산"},
{id:"calc03",cat:"calc",lv:1,type:"num",
 q:"생리식염수 1,000mL를 8시간 동안 주입하라는 처방이다. 주입 속도는? (mL/hr)",
 a:125,tol:0.5,unit:"mL/hr",
 exp:"1,000mL ÷ 8hr = 125mL/hr.",
 tip:"수액 교체 시각을 미리 계산해 인계장에 적어 두면 다음 근무자가 편하다.",src:"약물 계산"},
{id:"calc04",cat:"calc",lv:1,type:"num",
 q:"수액 500mL를 4시간 동안, 20gtt/mL 수액세트로 주입한다. 분당 방울 수는? (gtt/min, 정수)",
 a:42,tol:0.5,unit:"gtt/min",
 exp:"500mL ÷ 240분 = 2.083mL/min. × 20gtt/mL = 41.7 ≈ 42gtt/min.",
 tip:"gtt/min = (총량 mL × drop factor) ÷ 총 시간(분). 소아용 미세점적 세트는 60gtt/mL로 mL/hr와 gtt/min 숫자가 같다.",src:"약물 계산"},
{id:"calc05",cat:"calc",lv:2,type:"num",
 q:"Heparin 25,000U를 500mL에 혼합했다. 1,000U/hr로 주입하려면 속도는? (mL/hr)",
 a:20,tol:0.1,unit:"mL/hr",
 exp:"농도 = 25,000 ÷ 500 = 50U/mL. 1,000 ÷ 50 = 20mL/hr.",
 tip:"Heparin은 고위험 약물이다. 농도, 속도, 볼루스 여부를 두 사람이 독립적으로 확인한다.",src:"약물 계산"},
{id:"calc06",cat:"calc",lv:1,type:"num",
 q:"Epinephrine 1mg/mL(1:1,000) 앰플. 성인 아나필락시스 환자에게 0.5mg IM을 투여하려면 몇 mL를 재야 하나?",
 a:0.5,tol:0.01,unit:"mL",
 exp:"1mg/mL이므로 0.5mg = 0.5mL.",
 tip:"0.1mg/mL(1:10,000) 제제와 혼동하면 10배 오류가 난다. 농도를 소리 내어 확인하자.",src:"약물 계산"},
{id:"calc07",cat:"calc",lv:2,type:"num",
 q:"Nicardipine 20mg을 200mL에 혼합했다. 5mg/hr로 시작하려면 속도는? (mL/hr)",
 a:50,tol:0.1,unit:"mL/hr",
 exp:"농도 = 20mg ÷ 200mL = 0.1mg/mL. 5 ÷ 0.1 = 50mL/hr.",
 tip:"증량 처방(예: 2.5mg/hr씩)이 있으면 mL/hr 증가폭도 미리 계산해 둔다.",src:"약물 계산"},
{id:"calc08",cat:"calc",lv:1,type:"num",
 q:"혈압 120/60mmHg인 환자의 평균동맥압(MAP)은? (mmHg)",
 a:80,tol:0.5,unit:"mmHg",
 exp:"MAP ≈ (SBP + 2 × DBP) ÷ 3 = (120 + 120) ÷ 3 = 80mmHg.",
 tip:"패혈성 쇼크의 승압제 목표는 대개 MAP 65mmHg 이상이다.",src:"생리학"},
{id:"calc09",cat:"calc",lv:1,type:"num",
 q:"HR 120회/분, SBP 80mmHg인 외상 환자의 쇼크 지수(Shock Index)는?",
 a:1.5,tol:0.05,unit:"",
 exp:"쇼크 지수 = HR ÷ SBP = 120 ÷ 80 = 1.5. 일반적으로 1.0 이상이면 의미 있는 순환 저하를 시사한다.",
 tip:"혈압이 '정상'으로 보여도 쇼크 지수가 높으면 숨은 출혈을 의심한다.",src:"외상 사정"},
{id:"calc10",cat:"calc",lv:3,type:"num",
 q:"Dobutamine 250mg/250mL. 80kg 환자에게 5mcg/kg/min으로 주입하려면? (mL/hr)",
 a:24,tol:0.1,unit:"mL/hr",
 exp:"농도 = 250,000 ÷ 250 = 1,000mcg/mL. 5 × 80 × 60 = 24,000mcg/hr. 24,000 ÷ 1,000 = 24mL/hr.",
 tip:"1mg/mL 농도라면 'mcg/kg/min × kg × 0.06'으로 빠르게 암산할 수 있다.",src:"약물 계산"},

/* ───────── ABGA·검사 ───────── */
{id:"lab01",cat:"lab",lv:1,type:"mc",
 q:"pH 7.25, PaCO₂ 60mmHg, HCO₃⁻ 26mEq/L. 해석은?",
 opts:["대사성 산증","호흡성 산증(급성, 비보상)","대사성 알칼리증","호흡성 알칼리증"],a:1,
 exp:"pH 낮음(산증) + PaCO₂ 상승 → 호흡성 산증. HCO₃⁻가 정상 범위라 아직 신장 보상이 이루어지지 않은 급성 상태다.",
 tip:"COPD 악화, 진정제 과다, 의식저하 환자의 환기 상태를 확인한다.",src:"ABGA 해석"},
{id:"lab02",cat:"lab",lv:1,type:"mc",
 q:"pH 7.30, PaCO₂ 30mmHg, HCO₃⁻ 14mEq/L. 해석은?",
 opts:["호흡성 산증","대사성 산증(호흡 보상 동반)","대사성 알칼리증","정상"],a:1,
 exp:"pH 낮음 + HCO₃⁻ 감소 → 대사성 산증. PaCO₂ 감소는 과호흡을 통한 보상이다.",
 tip:"대사성 산증이면 음이온차(AG)를 계산해 원인을 좁힌다(DKA, 젖산증, 중독 등).",src:"ABGA 해석"},
{id:"lab03",cat:"lab",lv:2,type:"num",
 q:"Na 140, Cl 100, HCO₃⁻ 12mEq/L. 음이온차(Anion gap)는?",
 a:28,tol:0.5,unit:"mEq/L",
 exp:"AG = Na − (Cl + HCO₃⁻) = 140 − (100 + 12) = 28. 정상(대략 8~12)보다 높아 음이온차 증가성 대사성 산증이다.",
 tip:"AG 증가 원인 암기: 젖산증, 케톤산증(DKA·알코올·기아), 신부전, 독성물질(메탄올, 에틸렌글리콜, 살리실산 등).",src:"ABGA 해석"},
{id:"lab04",cat:"lab",lv:3,type:"num",
 q:"대사성 산증에서 HCO₃⁻ 12mEq/L일 때 Winter 공식으로 예상되는 PaCO₂(중앙값)는? (mmHg)",
 a:26,tol:0.5,unit:"mmHg",
 exp:"예상 PaCO₂ = 1.5 × HCO₃⁻ + 8 (±2) = 1.5 × 12 + 8 = 26(24~28). 실제가 이보다 높으면 호흡성 산증이 동반된 것이다.",
 tip:"DKA 환자의 PaCO₂가 예상보다 높다면 호흡근 피로 신호일 수 있다.",src:"ABGA 해석"},
{id:"lab05",cat:"lab",lv:2,type:"mc",

{id:"lab06",cat:"lab",lv:2,type:"mc",
 q:"DKA 환자에게 인슐린 지속주입을 시작하기 전에 반드시 확인해야 할 검사 결과는?",

{id:"lab07",cat:"lab",lv:3,type:"mc",
 q:"만성 저나트륨혈증을 교정할 때 삼투성 탈수초 증후군을 예방하기 위한 원칙은?",
 opts:["24시간 내 최대한 빨리 정상화","24시간 동안 교정폭을 제한(대개 8~10mEq/L 이내)","3% 식염수는 사용 금지","수분 섭취를 늘린다"],a:1,
 exp:"만성 저나트륨혈증은 너무 빠르게 교정하면 삼투성 탈수초 증후군 위험이 있다. 대부분 지침은 24시간 교정 폭에 상한(대개 8~10mEq/L)을 둔다.",

{id:"lab08",cat:"lab",lv:1,type:"mc",

{id:"tox01",cat:"tox",lv:1,type:"mc",

M("acls31","acls",2,"심정지 중 Sodium bicarbonate 일상적 투여에 대한 설명으로 옳은 것은?",["모든 심정지에 투여","일상적 투여는 권고되지 않음(고칼륨혈증·TCA 중독 등 특수 상황에서 고려)","첫 약물로 투여","Epinephrine과 같은 라인으로 섞어 투여"],1,"일반 심정지에서 Bicarbonate를 일상적으로 주지 않는다. 고칼륨혈증, TCA 중독 같은 특수 상황에서 고려한다.","Bicarbonate와 칼슘제를 같은 라인으로 섞으면 침전된다.",A25),
M("acls33","acls",2,"ROSC 후 명령에 따르지 않는 환자의 체온 관리 목표(AHA 2025)는?",["38~39°C","32~37.5°C 범위에서 계획적으로 조절","30°C 이하","체온 관리 불필요"],1,"AHA 2025 소생 후 알고리즘은 명령에 따르지 않는 환자에게 32~37.5°C 목표로 계획적 체온 조절을 시작하도록 한다.","발열 자체를 피하는 것이 핵심이다. 체온을 연속 측정한다.","AHA 2025 Post-Cardiac Arrest Care"),
M("acls34","acls",3,"ROSC 후 혈당 관리 목표로 AHA 2025가 제시하는 것은?",["70mg/dL 미만과 180mg/dL 초과를 피한다","혈당은 무관","250 이상 유지","50~70 유지"],0,"저혈당(<70mg/dL)과 고혈당(>180mg/dL)을 모두 피하도록 한다.","인슐린 주입 중이면 혈당 측정 간격을 촘촘히 한다.","AHA 2025 Post-Cardiac Arrest Care"),
M("acls35","acls",1,"아편유사제 과다복용 의심 환자가 맥박은 있으나 정상 호흡이 없다. 우선 조치는?",["가슴압박만 시행","인공호흡(환기) 지원과 Naloxone 투여","관찰","Flumazenil 투여"],1,"맥박이 있고 호흡이 없거나 비정상이면 환기 지원이 우선이며 Naloxone을 함께 투여한다. 맥박이 없으면 CPR이 우선이다.","Naloxone은 CPR을 대신하지 않는다.",A25),
M("acls36","acls",1,"코드 상황에서 '폐쇄형 의사소통(closed-loop)'의 예로 옳은 것은?",["지시를 듣고 바로 시행만 한다","'Epinephrine 1mg 투여하겠습니다' → 투여 후 '1mg 투여 완료했습니다'라고 복창한다","지시를 기록만 한다","여럿에게 동시에 지시한다"],1,"지시를 복창하고 수행 완료를 보고하면 누락·중복 투약을 막을 수 있다.","지시는 이름을 불러 한 사람에게 한다.",A25),

/* ── ECG (리듬 스트립 포함) ── */
M("ecg11","ecg",1,"리듬 스트립을 보고 판독하시오. (HR 약 75, P파-QRS 1:1, 규칙적)",["정상 동리듬","심방세동","1도 방실차단","접합부 리듬"],0,"각 QRS 앞에 일정한 P파가 있고 규칙적이며 HR 60~100이면 정상 동리듬이다.","판독 순서: 속도 → 규칙성 → P파 → PR → QRS 폭.",ECGB,{ecg:"nsr"}),
M("ecg12","ecg",1,"리듬 스트립을 판독하시오.",["동성 빈맥","동서맥","3도 방실차단","심실 고유리듬"],1,"P-QRS 관계는 정상이고 속도만 60회/분 미만이면 동서맥이다.","운동선수·수면 중에는 정상일 수 있다. 증상 여부가 처치를 결정한다.",ECGB,{ecg:"sbrady"}),
M("ecg13","ecg",1,"리듬 스트립을 판독하시오.",["동성 빈맥","SVT","심방조동","심실빈맥"],0,"P파가 보이고 1:1 전도, HR 100 초과이면 동성 빈맥이다.","동성 빈맥은 원인(통증, 발열, 출혈, 탈수)을 치료한다. 리듬 자체를 '전환'하려 하지 않는다.",ECGB,{ecg:"stach"}),
M("ecg14","ecg",1,"리듬 스트립을 판독하시오.",["심방세동","심방조동","동성 부정맥","다소성 심방빈맥"],0,"P파 없음, 불규칙한 RR, 흔들리는 기저선 → 심방세동.","새로 생긴 AF는 발생 시각을 기록한다.",ECGB,{ecg:"afib"}),
M("ecg15","ecg",1,"리듬 스트립을 판독하시오.",["심방세동","심방조동","동성 빈맥","심실빈맥"],1,"톱니 모양 F파와 규칙적 QRS → 심방조동.","HR 150 근처의 규칙적 빈맥이면 조동을 의심한다.",ECGB,{ecg:"aflutter"}),
M("ecg16","ecg",2,"의식 명료, 혈압 안정인 환자의 리듬이다. 처치 순서로 옳은 것은?",["즉시 제세동","미주신경 자극 → Adenosine","Atropine","Amiodarone 300mg bolus"],1,"좁고 규칙적인 빈맥(SVT)이고 안정적이면 미주신경 자극 후 Adenosine을 투여한다.","수정 Valsalva(힘주기 후 눕히고 다리 올리기)가 성공률이 높다고 알려져 있다.","AHA 2025 ACLS Tachycardia",{ecg:"svt"}),
M("ecg17","ecg",1,"환자가 반응이 없고 맥박이 없다. 이 리듬의 처치는?",["동기화 심율동전환","즉시 제세동(비동기화)","Adenosine","경피 조율"],1,"넓은 QRS의 규칙적 빈맥 + 무맥 → 무맥성 VT. 즉시 제세동한다.","맥박 유무에 따라 처치가 완전히 달라진다. 항상 맥박부터!",A25,{ecg:"vt"}),
M("ecg18","ecg",1,"리듬 스트립을 판독하시오. 환자는 무반응·무맥이다.",["심실세동","무수축","심실빈맥","인공물"],0,"불규칙하고 형태가 없는 파형 → 심실세동. 즉시 제세동한다.","리드 탈락·움직임 인공물과 감별: 환자 상태를 먼저 본다.",A25,{ecg:"vf"}),
M("ecg19","ecg",1,"이 리듬에서 옳은 처치는?",["즉시 제세동","CPR과 가능한 한 빠른 Epinephrine","Atropine 3mg","동기화 심율동전환"],1,"무수축은 제세동 대상이 아니다. CPR과 Epinephrine, 원인 탐색을 한다.","리드 연결과 감도(gain)를 확인해 미세 VF가 아닌지 본다.",A25,{ecg:"asystole"}),
M("ecg20","ecg",1,"리듬 스트립을 판독하시오. (PR 간격이 일정하게 0.20초 초과)",["1도 방실차단","Mobitz I","Mobitz II","3도 방실차단"],0,"모든 P파가 전도되지만 PR이 일정하게 0.20초를 넘으면 1도 방실차단이다.","대개 증상이 없지만 새로 생겼다면 약물(β차단제, CCB, 디곡신)을 확인한다.",ECGB,{ecg:"avb1"}),
M("ecg21","ecg",2,"리듬 스트립을 판독하시오.",["1도 방실차단","Mobitz I(Wenckebach)","Mobitz II","3도 방실차단"],1,"PR이 점점 길어지다 QRS가 빠진다 → Mobitz I.","'멀어지다 멀어지다 빠진다'로 기억.",ECGB,{ecg:"mobitz1"}),
M("ecg22","ecg",2,"리듬 스트립을 판독하시오.",["Mobitz I","Mobitz II","1도 방실차단","동정지"],1,"PR은 일정한데 갑자기 QRS가 빠진다 → Mobitz II. 3도로 진행할 수 있어 위험하다.","경피 조율 패드를 미리 붙인다.",ECGB,{ecg:"mobitz2"}),
M("ecg23","ecg",2,"리듬 스트립을 판독하시오.",["Mobitz II","3도(완전) 방실차단","심방조동","동서맥"],1,"P파와 QRS가 각자 규칙적이고 서로 무관(방실해리), 넓은 QRS의 느린 심실 리듬 → 3도 방실차단.","P-P 간격과 R-R 간격을 따로 재 보면 쉽게 보인다.",ECGB,{ecg:"avb3"}),
M("ecg24","ecg",1,"스트립 중간의 넓고 이상한 박동은?",["심방조기수축(PAC)","심실조기수축(PVC)","접합부 이탈박동","심박조율 박동"],1,"P파 없이 일찍 나타난 넓고 기괴한 QRS와 반대 방향 T파 → PVC.","PVC가 잦아지면 칼륨·마그네슘·허혈을 확인한다.",ECGB,{ecg:"pvc"}),
M("ecg25","ecg",2,"QT 연장 병력이 있는 환자에게서 나타난 리듬이다. 맥박이 있다면 우선 고려 약물은?",["Adenosine","Magnesium sulfate","Amiodarone 반복","Atropine"],1,"QRS 진폭이 꼬이듯 커졌다 작아지는 다형성 VT → Torsades de pointes. Magnesium을 투여한다. 무맥이면 제세동.","QT 연장 약물을 중단하고 칼륨·마그네슘을 보정한다.",A25,{ecg:"torsades"}),
M("ecg26","ecg",1,"QRS 앞의 뾰족한 수직선은 무엇을 의미하나?",["인공물","심박조율기 스파이크","델타파","U파"],1,"QRS 직전의 좁은 수직 스파이크는 심실 조율 박동이다. 조율 박동의 QRS는 넓다.","스파이크 뒤에 QRS가 따라오지 않으면 '포착 실패'를 의심한다.",ECGB,{ecg:"paced"}),
M("ecg27","ecg",2,"투석 환자의 리듬 스트립이다. 가장 의심되는 전해질 이상은?",["저칼륨혈증","고칼륨혈증","저칼슘혈증","저나트륨혈증"],1,"좁고 높게 솟은 T파 → 고칼륨혈증.","즉시 의사에게 알리고 칼슘제·인슐린 준비를 예상한다.","전해질 응급",{ecg:"peakedt"}),
M("ecg28","ecg",2,"흉통 환자의 II 유도에서 보이는 소견과 우선 조치는?",["ST 하강 — 관찰","ST 상승 — 12유도 확인 후 STEMI 대응(심혈관 중재팀 연락)","정상 — 퇴원","QT 연장 — 마그네슘"],1,"J점 이후 ST 분절이 기저선보다 올라가 있다. 12유도로 확인하고 병원 STEMI 프로토콜을 가동한다.","Door-to-balloon 시간을 줄이려면 ECG 판독 공유가 가장 빨라야 한다.","ACS 관리",{ecg:"stemi"}),
M("ecg29","ecg",2,"리듬 스트립을 판독하시오. (HR 약 50, P파 없음, 좁은 QRS)",["접합부 리듬","동서맥","심실 고유리듬","3도 방실차단"],0,"P파가 없거나 역위이고 좁은 QRS가 40~60회/분으로 규칙적이면 접합부 리듬이다.","디곡신 독성이나 하벽 허혈에서 나타날 수 있다.",ECGB,{ecg:"junctional"}),
M("ecg30","ecg",2,"모니터에 이 리듬이 보이지만 환자는 무반응이고 맥박이 없다. 진단과 처치는?",["정상 — 관찰","무맥성 전기활동(PEA) — CPR, Epinephrine, 원인 탐색","VF — 제세동","무수축 — Atropine"],1,"조직화된 리듬이 있어도 맥박이 없으면 PEA다. 제세동 대상이 아니다.","PEA의 핵심은 H's & T's 탐색이다.",A25,{ecg:"nsr"}),
M("ecg31","ecg",1,"정상 PR 간격은?",["0.04~0.10초","0.12~0.20초","0.20~0.30초","0.36~0.44초"],1,"PR 정상치는 0.12~0.20초(작은 칸 3~5개)다.","작은 칸 1개 = 0.04초, 큰 칸 1개 = 0.20초.",ECGB),
M("ecg32","ecg",1,"정상 QRS 폭의 상한은?",["0.06초","0.12초 미만","0.20초","0.40초"],1,"QRS가 0.12초(작은 칸 3개) 이상이면 넓은 QRS다.","넓은 QRS 빈맥은 VT로 간주하는 것이 안전하다.",ECGB),
N("ecg33","ecg",1,"규칙적 리듬에서 R-R 간격이 큰 칸 4개다. 심박수는? (회/분)",75,0,"회/분","300 ÷ 큰 칸 수 = 300 ÷ 4 = 75.","빠른 추정: 큰 칸 1,2,3,4,5,6 → 300,150,100,75,60,50.",ECGB),
N("ecg34","ecg",1,"규칙적 리듬에서 R-R 간격이 작은 칸 15개다. 심박수는? (회/분)",100,0,"회/분","1500 ÷ 작은 칸 수 = 1500 ÷ 15 = 100.","1500 법은 규칙적 리듬에서 가장 정확하다.",ECGB),
N("ecg35","ecg",1,"불규칙한 리듬에서 6초 스트립 안에 QRS가 9개다. 심박수는? (회/분)",90,0,"회/분","6초 동안의 QRS 수 × 10 = 90.","AF처럼 불규칙한 리듬은 6초 법을 쓴다.",ECGB),
M("ecg36","ecg",1,"V1~V4 유도에서 ST 상승이 보인다. 해당 부위와 주로 관련된 혈관은?",["하벽 - RCA","전벽 - LAD","측벽 - LCx","후벽 - PDA"],1,"V1~V4는 전벽(중격 포함)을 반영하며 주로 좌전하행지(LAD) 폐색과 관련된다.","광범위 전벽 경색은 심인성 쇼크 위험이 높다.",ECGB),
M("ecg37","ecg",2,"I, aVL, V5, V6에서 ST 상승이 보인다. 해당 부위는?",["측벽","하벽","전벽 중격","우심실"],0,"I, aVL, V5~V6는 측벽을 반영한다.","하벽(II, III, aVF)과 측벽 유도는 서로 거울상 변화를 보일 수 있다.",ECGB),
M("ecg38","ecg",3,"흉통 환자에서 V1~V3에 수평 ST 하강과 높은 R파가 있다. 추가로 확인할 것은?",["aVR 유도만","후벽 유도(V7~V9)","사지 유도 재부착","우측 유도 없이 관찰"],1,"V1~V3의 ST 하강은 후벽 경색의 거울상일 수 있다. V7~V9를 붙여 ST 상승을 확인한다.","후벽 STEMI는 놓치기 쉬운 STEMI 상당 소견이다.",ECGB),
M("ecg39","ecg",1,"비외상성 흉통 환자 도착 후 12유도 ECG를 시행·판독하는 목표 시간은?",["10분 이내","30분 이내","1시간 이내","진료 순서대로"],0,"흉통 환자는 도착 후 10분 이내에 12유도 ECG를 시행하고 판독을 받는다.","트리아지에서 흉통 키워드가 나오면 ECG부터 찍는 흐름을 만들어 두자.","ACS 관리"),
M("ecg40","ecg",2,"QT 간격이 크게 연장된 환자에게서 특히 우려되는 부정맥은?",["심방조동","Torsades de pointes","1도 방실차단","동성 빈맥"],1,"QT 연장은 Torsades 위험을 높인다.","QT 연장 약물 추가 처방 시 약사·의사와 상의한다.",ECGB),
M("ecg41","ecg",3,"WPW 증후군 환자의 빠르고 불규칙한 넓은 QRS 빈맥(AF 동반)에서 피해야 할 약물은?",["방실결절 차단제(Adenosine, CCB, β차단제, 디곡신)","Procainamide","동기화 심율동전환","산소"],0,"부전도로를 통한 전도가 증가해 VF로 악화될 수 있어 방실결절 차단제를 피한다.","불안정하면 동기화 심율동전환이 우선이다.",ECGB),

M("drug16","drug",2,"출혈 외상 환자에서 Tranexamic acid(TXA) 투여 시점으로 옳은 것은?",["손상 후 3시간 이내","24시간 후","출혈이 멈춘 뒤","시점 무관"],0,"TXA는 손상 후 3시간 이내 투여할 때 이득이 있고, 늦게 주면 해로울 수 있다.","손상 시각을 꼭 확인·기록한다.","외상 소생"),
M("drug17","drug",3,"와파린 복용 중 생명을 위협하는 출혈이 있을 때 일반적인 역전 방법은?",["Protamine","4인자 프로트롬빈 복합체(PCC) + 비타민 K IV","Naloxone","Idarucizumab"],1,"주요 출혈에는 빠른 역전을 위해 PCC와 비타민 K IV를 함께 쓴다.","INR 결과를 기다리지 말고 약 준비를 시작하는 경우가 많다. 기관 지침 확인.","항응고 역전"),

M("drug19","drug",3,"Dabigatran의 특이 역전제는?",["Idarucizumab","Andexanet alfa","Protamine","Vitamin K"],0,"Idarucizumab은 Dabigatran 특이 항체 조각이다.","환자의 항응고제 종류와 마지막 복용 시각을 확인한다.","항응고 역전"),
M("drug20","drug",1,"정맥으로 투여할 수 있는 인슐린은?",["속효성(Regular) 인슐린","NPH","Glargine","혼합형 인슐린"],0,"IV 투여가 가능한 것은 Regular 인슐린이다.","인슐린은 'U'를 쓰지 말고 'units'로 적는다(오독 방지).","고위험 약물 안전"),
M("drug21","drug",3,"화상 24시간 이후, 압궤손상 환자에서 Succinylcholine이 위험한 이유는?",["저혈압","심한 고칼륨혈증","저혈당","서맥만"],1,"탈분극성 근이완제는 칼륨을 올린다. 화상·압궤·장기 부동 환자는 수용체 증가로 위험한 고칼륨혈증이 생길 수 있다.","RSI 전 '숙시닐콜린 금기' 체크리스트를 확인하자.","RSI 약물"),
M("drug22","drug",2,"Rocuronium의 신경근 차단을 빠르게 역전시키는 약물은?",["Sugammadex","Naloxone","Atropine","Neostigmine 단독이 유일"],0,"Sugammadex는 Rocuronium/Vecuronium을 직접 결합해 역전시킨다.","근이완 중에는 진정이 유지되는지 반드시 확인한다(의식 있는 마비 방지).","RSI 약물"),
M("drug23","drug",2,"Ketamine의 특징으로 옳은 것은?",["기도 반사와 혈압을 비교적 유지, 각성 반응 가능","심한 저혈압이 흔함","진통 효과 없음","호흡억제가 가장 심함"],0,"Ketamine은 해리성 마취제로 혈압·기도반사를 비교적 유지하며 진통 효과가 있다. 각성 시 환각이 생길 수 있다.","분비물 증가에 대비해 흡인을 준비한다.","RSI 약물"),
M("drug24","drug",2,"Propofol 투여 중 가장 흔하게 모니터링할 부작용은?",["저혈압·호흡억제","고혈압","고혈당","서맥만 단독"],0,"Propofol은 혈관확장과 호흡억제를 일으킨다.","지질 제형이라 무균 조작과 교체 주기를 지킨다.","진정 약물"),
M("drug25","drug",3,"Etomidate의 대표적 부작용은?",["부신피질 억제","심한 고혈압","기관지수축","고칼륨혈증"],0,"Etomidate는 혈역학적으로 안정적이지만 일시적 부신 억제를 일으킬 수 있다.","근간대(myoclonus)가 경련처럼 보일 수 있다.","RSI 약물"),
M("drug26","drug",2,"성인 Phenytoin IV 투여 시 옳은 것은?",["5% 포도당에 희석, 빠르게","생리식염수만 사용, 분당 50mg 이하 속도","근육주사","원액 IV push 빠르게"],1,"Phenytoin은 포도당액에서 침전되며, 빠르게 주면 저혈압·부정맥이 생긴다. 성인 최대 50mg/min.","혈관외유출 시 조직 손상(purple glove)이 생길 수 있어 굵은 혈관을 쓴다.","경련중첩증 지침"),
M("drug27","drug",2,"Vancomycin 주입 중 얼굴·목이 붉어지고 가렵다. 가장 적절한 대응은?",["즉시 Epinephrine IM","주입을 멈추고 보고, 이후 속도를 늦춰 재개(처방에 따라)","속도를 높인다","정상 반응이니 무시"],1,"빠른 주입에 따른 Vancomycin 주입반응(홍조 증후군)이 흔하다. 주입 속도를 늦추면 대개 예방된다.","호흡곤란·저혈압이 있으면 아나필락시스로 대응한다.","약리 기본"),
M("drug28","drug",3,"Nitroprusside 지속주입 시 주의할 점은?",["빛 차단, 시안화물 독성 감시","냉장 보관만","IM 투여","산소 금기"],0,"Nitroprusside는 빛에 분해되며 장기·고용량 사용 시 시안화물 독성이 생길 수 있다.","동맥압 연속 감시 하에 조절한다.","약리 기본"),
M("drug29","drug",2,"빠른 심실반응의 심방세동에서 Diltiazem 투여 시 주의할 상황은?",["저혈압·비대상성 심부전","고혈압","발열","두통"],0,"Diltiazem은 음성 변력 작용과 혈관확장으로 저혈압·심부전 악화를 일으킬 수 있다.","투여 후 혈압을 자주 측정한다.","AF 관리"),
M("drug30","drug",2,"디곡신 독성의 증상으로 옳은 것은?",["오심, 시야 이상(황록색 시야), 부정맥","고열","피부 발진만","과다수면만"],0,"오심·구토, 시야 변화, 다양한 부정맥이 대표적이다.","저칼륨은 독성을 악화시킨다. 칼륨 수치를 꼭 같이 본다.","독성학 기본"),
M("drug31","drug",2,"고칼륨혈증 치료에서 칼륨을 세포 안으로 이동시키는 약물은?",["Salbutamol(Albuterol) 흡입","Calcium gluconate","Furosemide","생리식염수"],0,"β2 작용제와 인슐린+포도당은 칼륨을 세포 안으로 이동시킨다. 칼슘은 막 안정화, 이뇨제·투석은 배설이다.","Salbutamol 고용량 사용 시 빈맥을 관찰한다.","전해질 응급"),
M("drug32","drug",2,"아나필락시스에서 Epinephrine IM 반응이 부족할 때 반복 간격은?",["5~15분마다","1시간마다","반복 불가","24시간 후"],0,"반응이 부족하면 5~15분 간격으로 반복할 수 있다.","반복이 필요하면 정맥 Epinephrine 지속주입을 준비하는 경우가 있다.","아나필락시스 진료지침"),
M("drug33","drug",1,"다음 중 일반적으로 고위험 약물(High-alert medication)로 분류되지 않는 것은?",["인슐린","Heparin","고농도 KCl","경구 Acetaminophen"],3,"인슐린, 항응고제, 고농도 전해질, 아편유사제 등은 오류 시 심각한 위해를 줄 수 있는 고위험 약물이다.","고위험 약물은 독립적 이중 확인을 한다.","ISMP 고위험 약물"),
M("drug34","drug",2,"'hydrOXYzine / hydrALAZINE'처럼 일부를 대문자로 쓰는 목적은?",["보기 좋게","모양·이름이 비슷한 약(LASA)의 혼동 방지","약 가격 표시","보험 코드"],1,"Tall Man lettering은 이름이 비슷한 약물의 혼동을 줄이기 위한 표기법이다.","보관 위치도 분리한다.","환자안전"),
M("drug35","drug",2,"영양 결핍이 의심되는 만성 알코올 사용자에게 포도당을 줄 때 함께 고려하는 약물은?",["Thiamine(비타민 B1)","Vitamin C","Naloxone","Potassium only"],0,"Thiamine 결핍 상태에서 포도당을 주면 Wernicke 뇌병증 위험이 있어 Thiamine을 함께(또는 먼저) 투여한다.","저혈당 교정을 Thiamine 때문에 늦추지는 않는다.","독성학 기본"),

M("lab12","lab",2,"흉통 발생 1시간 만에 내원한 환자의 첫 트로포닌이 정상이다. 옳은 해석은?",["심근경색 배제","정해진 간격으로 반복 측정이 필요","트로포닌은 의미 없음","즉시 퇴원"],1,"초기에는 상승 전일 수 있어 기관 프로토콜에 따라 반복 측정한다.","채혈 시각을 정확히 기록해야 변화량을 해석할 수 있다.","ACS 관리"),
M("lab13","lab",1,"저칼슘혈증에서 볼 수 있는 징후는?",["Chvostek·Trousseau 징후","Kernig 징후","Murphy 징후","Babinski 징후"],0,"신경근 흥분성 증가로 안면 경련(Chvostek), 손목 경련(Trousseau)이 나타난다.","대량 수혈 후 시트르산에 의한 저칼슘을 기억하자.","전해질"),
M("lab14","lab",2,"정맥로 위쪽에서 어렵게 채혈한 검체의 칼륨이 6.8인데 ECG는 정상이다. 먼저 고려할 것은?",["용혈에 의한 가성 고칼륨혈증 가능성 → 재채혈","즉시 투석","무시","칼륨 보충"],0,"용혈·오랜 토니켓·주먹 쥐기 등으로 칼륨이 거짓으로 높게 나올 수 있다. 보고 후 재채혈한다.","ECG 변화가 있으면 재검을 기다리지 말고 치료한다.","검체 관리"),
M("lab15","lab",1,"성인 저혈당으로 판단하는 일반적 기준은?",["70mg/dL 미만","100mg/dL 미만","140mg/dL 미만","40mg/dL 미만만"],0,"일반적으로 70mg/dL 미만을 저혈당으로 보고, 54 미만은 임상적으로 중요한 저혈당이다.","의식 변화 환자는 혈당을 '활력징후'처럼 먼저 잰다.","저혈당 관리"),

M("lab17","lab",2,"DKA 치료 중 혈당이 약 250mg/dL로 떨어졌다. 일반적인 다음 조치는?",["인슐린 중단","수액에 포도당을 추가하고 인슐린은 유지(케톤 해소까지)","포도당 금지","칼륨 중단"],1,"산증이 해소될 때까지 인슐린을 유지해야 하므로, 저혈당 방지를 위해 포도당 함유 수액을 추가한다.","혈당이 떨어졌다고 인슐린을 끄면 DKA가 재발한다.","ADA 고혈당 위기 지침"),

M("tri18","triage",2,"두부외상 환자의 한쪽 동공이 커지고 빛반사가 없다. 의미하는 것은?",["정상 변이","뇌탈출(herniation) 가능성","약물 효과만","안구 건조"],1,"동측 동안신경 압박에 의한 뇌탈출 징후일 수 있어 즉시 보고한다.","GCS와 동공을 함께 추적 기록한다.","신경 사정"),
M("tri19","triage",3,"뇌졸중 환자에서 대혈관 폐색(LVO)을 시사하는 소견은?",["안구 편위, 실어증 또는 무시, 심한 편마비","가벼운 손 저림만","두통만","어지럼만"],0,"피질 징후(실어증·무시·시선 편위)와 심한 결손은 LVO를 시사하며 혈전제거술 가능 병원 판단에 쓰인다.","LVO 의심이면 CT 혈관조영 준비를 빨리 연계한다.","AHA/ASA 급성 뇌졸중 지침"),

M("tra08","trauma",1,"경추 손상이 의심되는 환자의 기도 확보 시 옳은 것은?",["머리를 뒤로 젖힌다","턱 들어올리기(jaw thrust)와 손으로 경추 정렬 유지","엎드리게 한다","베개를 받친다"],1,"경추 손상 의심 시 jaw thrust를 쓰고 한 사람이 머리·목을 정렬 유지한다.","",""),

M("tra10","trauma",1,"다발성 늑골 골절 환자의 흉벽 일부가 흡기 때 들어가고 호기 때 나온다. 이 소견은?",["동요흉(Flail chest)","긴장성 기흉","심장눌림증","횡격막 탈장"],0,"모순 운동(paradoxical movement)은 동요흉의 특징이다.","통증 조절이 환기에 직결된다.","ATLS"),

M("tra12","trauma",2,"척수손상 환자가 저혈압과 함께 서맥, 따뜻하고 건조한 피부를 보인다.",["출혈성 쇼크","신경성 쇼크","심인성 쇼크","아나필락시스"],1,"교감신경 차단으로 혈관확장과 서맥이 생기는 신경성 쇼크다.","외상 환자의 저혈압은 출혈을 먼저 배제해야 한다.","ATLS"),
M("tra13","trauma",2,"골반 골절로 불안정한 환자에게 골반 고정대(binder)를 적용할 위치는?",["장골능(허리) 높이","대퇴골 대전자 높이","무릎","배꼽 위"],1,"대전자 높이에 둘러야 골반 용적을 줄이는 효과가 있다.","골반을 반복해서 흔들어 검사하지 않는다(출혈 악화).","ATLS"),
M("tra14","trauma",2,"두부외상 후 귀 뒤 멍(Battle sign)과 눈 주위 멍(raccoon eyes)이 있다. 피해야 할 처치는?",["경비위관(NG) 삽입","구강위관 삽입","산소 투여","정맥로 확보"],0,"두개저 골절이 의심되면 비강을 통한 관 삽입은 두개 내로 들어갈 위험이 있어 피한다.","귀·코에서 맑은 액체가 나오면 뇌척수액 누출을 의심한다.","ATLS"),
M("tra15","trauma",1,"두개내압 상승의 후기 징후인 Cushing 3징후는?",["고혈압(맥압 증가), 서맥, 불규칙 호흡","저혈압, 빈맥, 과호흡","고열, 빈맥, 발한","저혈압, 서맥, 따뜻한 피부"],0,"Cushing 반응은 뇌탈출 임박을 시사하는 후기 징후다.","즉시 보고하고 머리 30도 거상, 경정맥 압박 피하기를 확인한다.","신경 사정"),

M("ped08","ped",1,"소아 평가 삼각형(PAT)의 세 요소는?",["외관, 호흡 노력, 피부 순환","혈압, 맥박, 체온","GCS, 동공, 반사","체중, 키, 머리둘레"],0,"손대지 않고 멀리서 외관, 호흡 노력, 피부색으로 첫인상을 판단한다.","",""),
M("ped09","ped",2,"개 짖는 듯한 기침과 흡기 천명이 있는 3세 아이. 흔히 쓰는 치료는?",["Dexamethasone, 중증 시 Epinephrine 흡입","항생제만","Adenosine","즉시 삽관"],0,"크룹은 스테로이드가 기본이고, 중등도 이상이면 Epinephrine 분무를 쓴다.","아이를 보호자 품에서 편하게 두어 울음을 줄인다.","소아 응급"),
M("ped10","ped",2,"고열, 침 흘림, 앞으로 기댄 자세(tripod)의 아이. 후두개염이 의심될 때 피해야 할 것은?",["설압자로 인두 검사","보호자와 함께 두기","산소 투여","전문 기도팀 호출"],0,"자극하면 완전 기도폐쇄가 올 수 있어 인두 검사·억지 눕히기를 하지 않는다.","",""),
M("ped11","ped",2,"단순 열성경련의 특징은?",["15분 미만, 전신성, 24시간 내 재발 없음","30분 이상 지속","국소성 경련","신경학적 결손 지속"],0,"단순 열성경련은 짧고 전신성이며 24시간 내 반복되지 않는다.","보호자에게 경련 시간 측정과 옆으로 눕히기를 교육한다.","소아 응급"),
M("ped12","ped",3,"저혈당 소아에게 정맥 포도당을 줄 때 흔히 쓰는 제제는?",["D10 5~10mL/kg","D50 원액 bolus","3% 식염수","인슐린"],0,"소아는 혈관 손상을 줄이기 위해 낮은 농도(D10 등)를 체중 기반으로 준다.","",""),
M("ped13","ped",1,"아동학대가 의심되는 소견은?",["발달 단계와 맞지 않는 손상, 엉덩이·귀·몸통 등 비골성 부위 멍","무릎 찰과상","이마 혹 1개","손바닥 가시"],0,"걷지 못하는 영아의 멍, 설명과 맞지 않는 손상은 학대를 의심한다. 간호사는 신고의무자다.","보호자와 아이의 진술을 따로, 그대로 기록한다.","아동학대 대응"),
M("ped14","ped",1,"의식 있는 영아의 이물에 의한 완전 기도폐쇄 처치는?",["복부 밀어내기","등 두드리기 5회 + 가슴 밀어내기 5회 반복","손가락으로 맹목적 제거","물을 먹인다"],1,"영아는 복부 밀어내기를 하지 않는다. 등 두드리기와 가슴 밀어내기를 반복한다.","",""),
N("ped15","ped",2,"4세 아이의 커프 있는 기관내관 크기 추정치는? (내경 mm, 공식: 나이/4 + 3.5)",4.5,0.01,"mm","4 ÷ 4 + 3.5 = 4.5mm.","한 사이즈 위·아래 튜브를 같이 준비한다.","AHA PALS"),
N("ped16","ped",1,"5세 아이의 체중 추정치는? (kg, 공식: (나이 + 4) × 2)",18,0,"kg","(5 + 4) × 2 = 18kg.","가능하면 실제 체중이나 길이 기반 테이프를 우선한다.","APLS 공식"),
M("ped17","ped",2,"간헐적 극심한 복통, 다리를 배로 당김, 젤리 같은 혈변. 의심 질환은?",["장중첩증","충수염","위장염","변비"],0,"영유아 장중첩증의 전형적 양상이다.","",""),
M("ped18","ped",2,"영아 세기관지염(RSV 등) 치료의 중심은?",["지지요법(코 흡인, 수분, 산소)","항생제","스테로이드 일상 사용","기관지확장제 일상 사용"],0,"대부분 지지요법이 중심이다. 코 흡인만으로 수유·호흡이 좋아지기도 한다.","무호흡, 탈수, 산소 요구는 입원 지표다.","소아 응급"),

M("ob01","ob",1,"무월경 후 하복부 통증과 질출혈이 있는 여성. 가장 먼저 배제해야 할 질환은?",["자궁외임신","방광염","과민성 장증후군","생리통"],0,"자궁외임신 파열은 출혈성 쇼크로 진행할 수 있다.","활력징후, 정맥로, hCG, 혈액형 검사를 빠르게.",""),
M("ob02","ob",2,"임신 3기에 통증 없는 선홍색 질출혈. 의심 질환과 금기 처치는?",["전치태반 — 내진 금지","태반조기박리 — 내진 필수","정상 이슬 — 관찰","자궁파열 — 마사지"],0,"무통성 선홍색 출혈은 전치태반을 의심하며, 초음파 확인 전 내진은 대량출혈을 유발할 수 있다.","",""),
M("ob03","ob",2,"임신 후기 외상 후 복통, 단단한 자궁, 질출혈. 의심 질환은?",["태반조기박리","전치태반","정상 진통","방광염"],0,"통증과 자궁 경직을 동반한 출혈은 태반조기박리다. 출혈이 숨어 있을 수 있다.","외상 임부는 태아 감시를 연장한다.",""),
M("ob04","ob",1,"전자간증 진단에서 혈압 기준은?",["임신 20주 이후 140/90mmHg 이상(+ 단백뇨 또는 장기 손상)","120/80","160/110만","임신 초기 130/80"],0,"20주 이후 새로 생긴 고혈압(≥140/90)에 단백뇨나 장기 기능 이상이 동반된다.","두통·시야장애·상복부 통증은 중증 징후다.","ACOG"),
M("ob05","ob",1,"자간증(임부 경련)의 1차 약물은?",["Magnesium sulfate","Phenytoin","Diazepam 단독","Haloperidol"],0,"Magnesium sulfate가 경련 치료·예방의 1차 약물이다.","",""),
M("ob06","ob",2,"Magnesium 투여 중 심부건반사 소실, 호흡수 감소. 해독제는?",["Calcium gluconate","Naloxone","Protamine","Vitamin K"],0,"마그네슘 독성은 반사 소실 → 호흡억제 → 심정지 순으로 진행할 수 있다. 칼슘이 해독제다.","주입 중 반사·호흡수·소변량을 정기적으로 확인한다.",""),
M("ob07","ob",2,"임신 20주 이상 임부 심정지 CPR 시 추가할 처치는?",["수동 좌측 자궁 전위","다리를 높이 든다","복위로 눕힌다","압박 위치를 배꼽으로"],0,"자궁이 대정맥을 압박하므로 손으로 자궁을 왼쪽으로 밀어 정맥환류를 돕는다.","",A25),
M("ob08","ob",3,"자궁저부가 배꼽 이상인 임부 심정지에서 ROSC가 없을 때 고려하는 처치는?",["사후 제왕절개(소생적 자궁절개)를 조기에","CPR 중단","Epinephrine 금지","제세동 금지"],0,"모체 소생을 위해 소생적 자궁절개를 조기에(수 분 내) 고려하므로 즉시 산과·신생아팀을 호출한다.","",A25),
M("ob09","ob",3,"Rh 음성 임부가 복부 외상을 입었다. 고려할 약물은?",["Rh 면역글로불린","Vitamin K","Oxytocin","Insulin"],0,"모체-태아 출혈로 인한 감작을 예방하기 위해 RhIG를 고려한다.","",""),
M("ob10","ob",2,"응급실에서 급속 분만 중 아기 머리가 나왔다. 다음으로 할 일은?",["목에 탯줄이 감겼는지 확인","즉시 몸을 당긴다","산모를 걷게 한다","머리를 다시 밀어 넣는다"],0,"머리가 나오면 제대 감김을 확인하고, 느슨하면 머리 위로 벗긴다.","출생 후 아기는 말리고 따뜻하게 하는 것이 우선이다.",""),
M("ob11","ob",2,"분만 후 대량출혈의 가장 흔한 원인과 초기 간호중재는?",["자궁이완 — 자궁저부 마사지와 자궁수축제","질 열상 — 관찰","혈액응고장애 — 아스피린","태반잔류 — 수분 제한"],0,"자궁이완이 가장 흔하다. 자궁저부 마사지와 Oxytocin 등 자궁수축제를 쓴다.","",""),
M("ob12","ob",1,"임신 후기 임부가 바로 누운 뒤 어지럽고 혈압이 떨어졌다. 조치는?",["좌측위로 돌린다","다리를 올린다","앉혀서 걷게 한다","수액 제한"],0,"앙와위 저혈압 증후군: 자궁이 하대정맥을 눌러 생긴다.","",""),
M("ob13","ob",3,"탯줄이 질 밖으로 탈출했다. 올바른 처치는?",["탯줄을 밀어 넣는다","선진부를 손으로 들어 올려 탯줄 압박을 줄이고 슬흉위 등 자세 유지","탯줄을 당긴다","산모에게 힘을 주게 한다"],1,"선진부를 들어 탯줄 압박을 막고 즉시 응급 분만을 준비한다. 노출된 탯줄은 젖은 거즈로 덮는다.","",""),
M("ob14","ob",1,"성폭력 피해자 응급 진료 시 증거 보존을 위한 안내로 옳은 것은?",["진료 전 샤워를 권한다","씻거나 옷을 갈아입지 않도록 하고 옷은 종이봉투에 따로 보관","옷을 비닐봉투에 함께 넣는다","증거 채취는 불필요"],1,"증거가 손상되지 않도록 씻지 않게 하고, 옷은 종이봉투에 개별 보관한다. 해바라기센터 등 연계 기관을 안내한다.","피해자 동의를 단계마다 확인한다.",""),

M("psy01","psych",1,"자살 생각을 직접 묻는 것에 대한 설명으로 옳은 것은?",["자살 위험을 높이므로 피한다","직접 묻는 것은 위험을 높이지 않으며 평가에 필요하다","보호자에게만 묻는다","의사만 물을 수 있다"],1,"'자살을 생각하고 있나요?'처럼 명확히 묻는 것이 평가의 출발점이다.","",""),
M("psy02","psych",1,"자살 위험이 가장 높은 상황은?",["구체적 계획과 수단을 가지고 있다","막연히 우울하다","잠이 늘었다","식욕이 줄었다"],0,"구체적 계획, 수단 접근, 이전 시도는 고위험 신호다.","",""),
M("psy03","psych",1,"자살 고위험 환자를 응급실에서 관리할 때 우선할 것은?",["혼자 조용히 둔다","위험 물건(끈·날붙이·약) 제거와 지속 관찰","외출 허용","휴대폰으로 검색하게 둔다"],1,"환경 안전과 1:1 관찰로 자해 수단을 차단한다.","화장실 이용 때도 관찰 원칙을 유지한다.",""),
M("psy04","psych",1,"흥분한 환자를 진정시키는 언어적 완화(de-escalation) 방법으로 옳은 것은?",["큰 소리로 단호하게 명령","차분하고 낮은 목소리, 안전 거리 확보, 출구를 막지 않는다","등을 돌리고 무시","여러 사람이 동시에 말한다"],1,"한 사람이 차분하게 말하고, 선택지를 주며 직원과 환자 모두의 출구를 확보한다.","",""),
M("psy05","psych",2,"신체 억제된 흥분 환자의 자세로 피해야 할 것은?",["엎드린(복위) 자세","측위","앙와위에서 머리 약간 거상","주기적 자세 변경"],0,"복위 억제는 질식·호흡부전 위험이 있어 피한다.","억제 중 호흡과 순환을 자주 확인한다.",""),
M("psy06","psych",2,"섬망과 치매를 구분하는 섬망의 특징은?",["급성 발생, 주의력 장애, 하루 중 변동","수년에 걸친 서서히 진행","의식 명료 유지","기억만 저하"],0,"섬망은 급성 발생·주의력 저하·변동성이 특징이며 원인 질환을 찾아야 한다.","감염, 약물, 저산소, 전해질 이상이 흔한 원인이다.",""),
M("psy07","psych",2,"처음 정신병 증상(환청·망상)을 보이는 환자에게 먼저 확인할 것은?",["혈당·산소포화도·활력징후 등 신체적 원인","정신과 입원 서류만","가족력만","종교"],0,"저혈당, 저산소, 중독, 감염 등 기질적 원인을 먼저 배제한다.","",""),
M("psy08","psych",2,"Haloperidol 투여 후 목이 뒤틀리고 눈이 위로 돌아간다(급성 근긴장이상). 치료 약물은?",["Benztropine 또는 Diphenhydramine","Naloxone","Haloperidol 추가","Flumazenil"],0,"항콜린제나 항히스타민제로 빠르게 호전된다.","",""),
M("psy09","psych",3,"항정신병약 복용 환자의 고열, 납관 강직, 의식변화, 자율신경 불안정. 의심 질환은?",["신경이완제 악성증후군","세로토닌 증후군","열성경련","저체온"],0,"원인 약 중단, 냉각, 수액, 필요 시 특이 약물(예: Dantrolene) 등 집중 치료가 필요하다.","CK 상승과 신기능을 확인한다.",""),
M("psy10","psych",1,"공황발작처럼 보이는 흉통·호흡곤란 환자에게 먼저 할 일은?",["불안으로 판단해 안정만","ECG 등으로 신체적 원인을 먼저 배제","진정제를 바로 투여","귀가 조치"],1,"심근경색, 폐색전, 부정맥 등을 먼저 배제한 뒤 공황으로 판단한다.","",""),
M("psy11","psych",2,"만취 상태 두부외상 환자에서 주의할 점은?",["의식저하를 술 탓으로만 돌리지 않는다","신경학적 사정 생략","무조건 귀가","보호자 없이 퇴원"],0,"술에 취한 것처럼 보이는 의식저하가 두개내출혈·저혈당일 수 있다. 반복 사정한다.","",""),
M("psy12","psych",1,"치료적 의사소통 기법으로 옳은 것은?",["'왜 그랬어요?'","'그때 어떤 기분이셨는지 더 말씀해 주시겠어요?'","'다 잘될 거예요'","'그런 생각은 하지 마세요'"],1,"개방형 질문은 감정 표현을 돕는다. '왜' 질문, 성급한 안심, 판단은 피한다.","",""),

/* ───────── 변형(랜덤) 계산 문제 ─────────
   매번 숫자가 바뀌어 답을 외울 수 없다. make(r) → 인스턴스 */
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const rnd=(r,lo,hi,step=1)=>lo+Math.floor(r()*((hi-lo)/step+1))*step;
const r1=x=>Math.round(x*10)/10, r2=x=>Math.round(x*100)/100;
const GEN=(id,cat,lv,title,make)=>({id,cat,lv,type:"num",gen:true,q:"[변형] "+title,src:"약물 계산(변형)",exp:"",tip:"",a:0,make});

GEN("gen_vaso","calc",2,"승압제 mcg/kg/min → mL/hr",r=>{
  const d=pick(r,[["Norepinephrine",4,250,[0.05,0.1,0.15,0.2]],["Norepinephrine",8,250,[0.05,0.1,0.2]],["Dopamine",400,250,[3,5,10]],["Dobutamine",250,250,[2.5,5,10]],["Epinephrine",4,250,[0.02,0.05,0.1]]]);
  const kg=rnd(r,50,95,5), dose=pick(r,d[3]); const conc=d[1]*1000/d[2]; const ans=r1(dose*kg*60/conc);
  return {q:`${d[0]} ${d[1]}mg/${d[2]}mL 혼합. ${kg}kg 환자에게 ${dose}mcg/kg/min으로 주입하려면? (mL/hr, 소수 첫째 자리)`,a:ans,tol:0.2,unit:"mL/hr",
   exp:`농도 = ${d[1]*1000} ÷ ${d[2]} = ${r2(conc)}mcg/mL. ${dose} × ${kg} × 60 = ${r2(dose*kg*60)}mcg/hr. ÷ ${r2(conc)} = ${ans}mL/hr.`,tip:"mL/hr = 용량 × 체중 × 60 ÷ 농도(mcg/mL)."};}),

GEN("gen_dhq","g_unit",1,"Desired/Have × Quantity",r=>{
  const d=pick(r,[["mg",[125,250,500],[[250,5],[125,5],[500,10]]],["mcg",[50,100,200],[[100,1],[50,1]]]]);
  const want=pick(r,d[1]), hv=pick(r,d[2]), have=hv[0], vol=hv[1]; const ans=r2(want/have*vol);
  return {q:`Order: ${want} ${d[0]}. Available: ${have} ${d[0]} per ${vol} mL. How many mL? (two decimals)`,a:ans,tol:0.02,unit:"mL",exp:`${want} ÷ ${have} × ${vol} = ${ans} mL.`,tip:"D/H × Q."};}),
GEN("gen_lbdose","g_unit",2,"lb 체중 → mg/kg 용량",r=>{
  const lb=rnd(r,110,242,22), mgkg=pick(r,[0.5,1,1.5,2,5,10]); const kg=lb/2.2; const ans=r1(kg*mgkg);
  return {q:`Client weighs ${lb} lb. Order: ${mgkg} mg/kg. Dose in mg? (one decimal)`,a:ans,tol:0.2,unit:"mg",exp:`${lb} ÷ 2.2 = ${r1(kg)} kg × ${mgkg} = ${ans} mg.`,tip:"먼저 kg으로 바꾼다."};}),
GEN("gen_io","g_unit",1,"oz 섭취량 → mL",r=>{
  const a=rnd(r,4,12), b=rnd(r,2,8); const ans=(a+b)*30;
  return {q:`A client drank ${a} oz of juice and ${b} oz of water. Total intake in mL? (1 oz = 30 mL)`,a:ans,tol:0.5,unit:"mL",exp:`(${a} + ${b}) × 30 = ${ans} mL.`,tip:""};}),
);

  const r = rng(hashStr(type + (seed || "")));
  const T = 6, W = 600, H = 130, base = 78, amp = 52, step = 0.004;
  const g = (t, c, w, a) => a * Math.exp(-((t - c) ** 2) / (2 * w * w));
  const beats = [], ps = [];
  let noise = () => 0, fn = null;
  const reg = (hr, o) => { const rr = 60 / hr; for (let t = 0.35 + r() * 0.2; t < T; t += rr) beats.push(Object.assign({ t, pr: 0.16 }, o)); };
  switch (type){
    case "nsr": reg(75); break;
    case "sbrady": reg(44); break;
    case "stach": reg(125); break;
    case "svt": reg(185, { pr: null }); break;
    case "junctional": reg(50, { pr: null }); break;
    case "avb1": reg(70, { pr: 0.32 }); break;
    case "peakedt": reg(78, { peakT: true }); break;
    case "stemi": reg(82, { stE: true }); break;
    case "paced": reg(70, { pr: null, wide: true, tInv: true, pace: true }); break;
    case "afib": { let t = 0.3; while (t < T){ beats.push({ t, pr: null }); t += 0.38 + r() * 0.55; }
      const f = [5.3 + r(), 7.1 + r(), 8.9 + r()], ph = [r() * 6, r() * 6, r() * 6];
      noise = t => 0.05 * Math.sin(2 * Math.PI * f[0] * t + ph[0]) + 0.035 * Math.sin(2 * Math.PI * f[1] * t + ph[1]) + 0.03 * Math.sin(2 * Math.PI * f[2] * t + ph[2]); break; }
    case "aflutter": { for (let t = 0.3; t < T; t += 0.4) beats.push({ t, pr: null });
      noise = t => { const x = (t * 5) % 1; return -0.16 * (x < 0.75 ? x / 0.75 : (1 - x) / 0.25) + 0.08; }; break; }
    case "mobitz1": { let t = 0.3, k = 0; const prs = [0.16, 0.26, 0.34];
      while (t < T){ if (k % 4 === 3){ ps.push(t + 0.16); t += 0.82; } else { beats.push({ t: t + prs[k % 4], pr: prs[k % 4] }); t += 0.82; } k++; } break; }
    case "mobitz2": { let t = 0.3, k = 0; while (t < T){ if (k % 3 === 2) ps.push(t + 0.16); else beats.push({ t: t + 0.16, pr: 0.16 }); t += 0.8; k++; } break; }
    case "avb3": { for (let t = 0.15; t < T; t += 0.72) ps.push(t); for (let t = 0.6 + r() * 0.3; t < T; t += 1.65) beats.push({ t, pr: null, wide: true, tInv: true }); break; }
    case "pvc": { reg(72); const i = 3 + Math.floor(r() * 2); if (beats[i]){ const prev = beats[i - 1].t; beats[i] = { t: prev + 0.45, pr: null, wide: true, tInv: true, big: true }; } break; }
    case "vt": for (let t = 0.2; t < T; t += 60 / 170) beats.push({ t, pr: null, wide: true, tInv: true, big: true }); break;
    case "vf": { const f = [3.7 + r(), 5.3 + r(), 6.9 + r(), 2.3 + r()], ph = f.map(() => r() * 6);
      fn = t => 0.32 * Math.sin(2 * Math.PI * f[0] * t + ph[0]) + 0.22 * Math.sin(2 * Math.PI * f[1] * t + ph[1]) + 0.14 * Math.sin(2 * Math.PI * f[2] * t + ph[2]) + 0.12 * Math.sin(2 * Math.PI * f[3] * t + ph[3]); break; }
    case "torsades": fn = t => 0.75 * Math.sin(2 * Math.PI * 4 * t) * (0.25 + 0.75 * Math.abs(Math.sin(Math.PI * t / 2.2))); break;
    case "asystole": { const ph = r() * 6; fn = t => 0.015 * Math.sin(2 * Math.PI * 0.4 * t + ph) + 0.006 * Math.sin(2 * Math.PI * 9 * t); break; }
    default: reg(75);
  }
  const y = t => {
    if (fn) return fn(t);
    let v = noise(t);
    for (const p of ps) v += g(t, p, 0.03, 0.19);
    for (const b of beats){
      const d = t - b.t; if (d < -0.5 || d > 0.7) continue;
      if (b.pr) v += g(t, b.t - b.pr, 0.03, ps.length ? 0.19 : 0.15);
      if (b.pace) v += (Math.abs(d + 0.07) < 0.004 ? 1.1 : 0);
      if (b.wide){ const s = b.big ? 1.25 : 1; v += g(t, b.t, 0.035, 1.0 * s) + g(t, b.t + 0.07, 0.035, -0.45 * s); v += g(t, b.t + 0.3, 0.07, b.tInv ? -0.35 * s : 0.3); }
      else {
        v += g(t, b.t - 0.025, 0.008, -0.1) + g(t, b.t, 0.011, 1.0) + g(t, b.t + 0.025, 0.009, -0.22);
        if (b.stE) v += g(t, b.t + 0.13, 0.055, 0.34) + g(t, b.t + 0.25, 0.06, 0.3);
        else if (b.peakT) v += g(t, b.t + 0.24, 0.028, 0.75);
        else v += g(t, b.t + 0.28, 0.048, 0.28);
      }
    }
    return v;
  };
  let d = "";
  for (let t = 0; t <= T; t += step){ const x = t / T * W, yy = base - y(t) * amp; d += (t ? "L" : "M") + x.toFixed(1) + " " + Math.max(2, Math.min(H - 2, yy)).toFixed(1); }
  let grid = "";
  for (let x = 0; x <= W; x += 4) grid += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" class="${x % 20 ? "gs" : "gl"}"/>`;
  for (let yy = 0; yy <= H; yy += 4) grid += `<line x1="0" y1="${yy}" x2="${W}" y2="${yy}" class="${yy % 20 ? "gs" : "gl"}"/>`;
  return `<div class="ecgbox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="리듬 스트립(6초, II 유도)">${grid}<path d="${d}" class="ew"/></svg><div class="ecgcap">6초 스트립 · 작은 칸 0.04초 · 큰 칸 0.2초</div></div>`;
}

/* ───────── 유틸 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => new Date(Date.now() + (window.__dayOffset || 0) * 864e5);
const ymd = d => { const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); };
const today = () => ymd(now());
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
const dayDiff = (a, b) => { const p = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); };
function hashStr(s){ let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r = Math.random){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg, ms = 2000){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

function sha256(ascii){
  function rr(v, a){ return (v >>> a) | (v << (32 - a)); }
  const bytes = unescape(encodeURIComponent(ascii)); const words = []; const len = bytes.length * 8;
  const K = [], H = []; let prime = 2, n = 0;
  const isP = x => { for (let f = 2; f * f <= x; f++) if (x % f === 0) return false; return true; };
  while (n < 64){ if (isP(prime)){ if (n < 8) H[n] = (Math.pow(prime, .5) * 4294967296) | 0; K[n++] = (Math.pow(prime, 1/3) * 4294967296) | 0; } prime++; }
  let s = bytes + "\x80"; while (s.length % 64 - 56) s += "\x00";
  for (let i = 0; i < s.length; i++) words[i >> 2] |= s.charCodeAt(i) << ((3 - i) % 4) * 8;
  words[words.length] = (len / 4294967296) | 0; words[words.length] = len;
  let h = H.slice();
  for (let j = 0; j < words.length;){
    const w = words.slice(j, j += 16), o = h.slice();
    for (let i = 0; i < 64; i++){
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = h[0], e = h[4];
      const t1 = h[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & h[5]) ^ (~e & h[6])) + K[i] +
        (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
      h = [(t1 + t2) | 0].concat(h); h[4] = (h[4] + t1) | 0; h.length = 8;
    }
    for (let i = 0; i < 8; i++) h[i] = (h[i] + o[i]) | 0;
  }
  return h.map(x => ("00000000" + (x >>> 0).toString(16)).slice(-8)).join("");
}

/* ───────── 저장소 · 기록 보호 ───────── */
function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ toast("저장 공간이 부족해 기록을 저장하지 못했어요."); return false; } }
function newUser(id, nick){
  return { v:3, id, nick: nick || id, created: today(),
    settings:{ daily:5, cats:Object.keys(CATS), theme:"auto", haptic:true },
    cards:{}, hist:{}, xp:0, session:null, sessions:{}, track:"er", bookmarks:[], custom:[], reports:[], bestStreak:0, lastBackup:null };
}
/* 이전 버전 데이터를 지우지 않고 구조만 확장한다 */
function migrate(u){
  const base = newUser(u.id, u.nick);
  u.settings = Object.assign({}, base.settings, u.settings || {});
  for (const k of ["cards","hist"]) if (!u[k] || typeof u[k] !== "object") u[k] = {};
  for (const k of ["bookmarks","custom","reports"]) if (!Array.isArray(u[k])) u[k] = [];
  u.settings.cats = (u.settings.cats || []).filter(c => CATS[c]); if (!u.settings.cats.length) u.settings.cats = Object.keys(CATS);
  if (typeof u.xp !== "number") u.xp = 0;
  if (typeof u.bestStreak !== "number") u.bestStreak = 0;
  if ((u.v || 1) < 2){ ["resp","ob","psych","infect"].forEach(k => { if (!u.settings.cats.includes(k)) u.settings.cats.push(k); }); u.v = 2; }
  if (u.v < 3){
    u.sessions = u.sessions || {};
    if (u.session){ const ids = u.session.ids || []; const tr = ids.length && ids.every(id => { const q = BANK.find(x => x.id === id); return q && trackOf(q.cat) === "gl"; }) ? "gl" : "er"; u.sessions[tr] = u.session; }
    for (const d in u.hist){ const h = u.hist[d]; if (h.done && !h.tr) h.tr = { er:true }; }
    GL_CATS.forEach(k => { if (!u.settings.cats.includes(k)) u.settings.cats.push(k); });
    u.track = "er"; u.v = 3;
  }
  // 이후 버전에서 새로 생긴 분야는 자동으로 켬
  Object.keys(CATS).forEach(k => { if (u.settings.seenCats && !u.settings.seenCats.includes(k) && !u.settings.cats.includes(k)) u.settings.cats.push(k); });
  u.settings.seenCats = Object.keys(CATS);
  if (!u.sessions || typeof u.sessions !== "object") u.sessions = {};
  if (!TRACKS[u.track]) u.track = "er";
  u.session = u.sessions[u.track] || null;
  return u;
}
const S = { user:null, tab:"home", quiz:null };
function persist(){
  const u = S.user; if (!u) return;
  u.sessions[u.track] = u.session;
  save(LS_U(u.id), u);
  autoSnapshot(u);
}
/* 자동 스냅샷: 하루 1번, 최근 7일치를 이 기기에 보관 */
function autoSnapshot(u, force){
  const snaps = load(LS_SNAP(u.id), []); const t = today();
  if (!force && snaps.length && snaps[0].date === t) return;
  if (!force && !Object.keys(u.cards).length) return;
  snaps.unshift({ date:t, ver:APP_VER, at:Date.now(), n:Object.keys(u.cards).length, user:JSON.parse(JSON.stringify(u)) });
  while (snaps.length > 7) snaps.pop();
  if (!save(LS_SNAP(u.id), snaps)){ snaps.length = Math.min(snaps.length, 2); save(LS_SNAP(u.id), snaps); }
}

function allQ(){ return BANK.concat((S.user?.custom || []).map(c => Object.assign({ custom:true, src:"내 문제(기관 프로토콜)", lv:2 }, c))); }
function qById(id){ return allQ().find(q => q.id === id); }
function inst(q, seed){ if (!q || !q.gen) return q; return Object.assign({}, q, q.make(rng(hashStr(String(seed)))), { title:q.q }); }
function curQ(){ const Z = S.quiz; const b = qById(Z.ids[Z.idx]); return b ? inst(b, Z.ids[Z.idx] + "|" + (Z.mode === "daily" ? today() : Z.started) + "|" + Z.idx) : null; }
const emptySel = v => v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length);

/* ───────── 레벨/스트릭 ───────── */
const TITLES = ["신규 간호사","프리셉티","독립 근무","숙련 간호사","프리셉터","차지 간호사","ER 베테랑","ER 마스터"];
function levelOf(xp){ const lv = Math.floor(Math.sqrt(xp / 60)) + 1; const cur = 60 * (lv - 1) ** 2, nxt = 60 * lv ** 2; return { lv, title: TITLES[Math.min(lv - 1, TITLES.length - 1)], pct: Math.round((xp - cur) / (nxt - cur) * 100), need: nxt - xp }; }
function streakOf(u){ let s = 0, d = today(); if (!u.hist[d]?.done) d = addDays(d, -1); while (u.hist[d]?.done){ s++; d = addDays(d, -1); } return s; }

/* ───────── 오늘의 세트 ───────── */
function catAcc(u){
  const r = {}; for (const c in CATS) r[c] = { n:0, ok:0 };
  for (const id in u.cards){ const q = qById(id); if (!q || !r[q.cat]) continue; r[q.cat].n += u.cards[id].seen; r[q.cat].ok += u.cards[id].right; }
  return r;
}
function dueList(u, tr){ const t = today(), cs = trackCats(u, tr); return allQ().filter(q => u.cards[q.id] && u.cards[q.id].due <= t && cs.includes(q.cat)); }
function buildDaily(u){
  const n = u.settings.daily, t = today(), r = rng(hashStr(u.id + t + u.track)), cs = trackCats(u);
  const allowed = q => cs.includes(q.cat);
  const due = dueList(u).sort((a, b) => { const A = u.cards[a.id], B = u.cards[b.id];
    return (A.due < B.due ? -1 : A.due > B.due ? 1 : 0) || ((A.streak ? 1 : 0) - (B.streak ? 1 : 0)) || (A.box - B.box) || (B.wrong - A.wrong); });
  const pick = due.slice(0, Math.max(1, Math.ceil(n * 0.6)));
  const acc = catAcc(u), seenTotal = Object.keys(u.cards).filter(id => { const q = qById(id); return q && cs.includes(q.cat); }).length;
  const maxLv = seenTotal < 15 ? 1 : seenTotal < 40 ? 2 : 3;
  let fresh = allQ().filter(q => !u.cards[q.id] && allowed(q));
  const weight = q => { const a = acc[q.cat]; const rate = a.n ? a.ok / a.n : .6; let w = 1 + (1 - rate) * 2; if (q.lv > maxLv) w *= .25; if (q.custom) w *= 1.5; return w * (0.5 + r()); };
  fresh = fresh.map(q => [q, weight(q)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const usedCat = {}; pick.forEach(q => usedCat[q.cat] = (usedCat[q.cat] || 0) + 1);
  const capPerCat = Math.max(2, Math.ceil(n / 3));
  for (const q of fresh){ if (pick.length >= n) break; if ((usedCat[q.cat] || 0) >= capPerCat) continue; pick.push(q); usedCat[q.cat] = (usedCat[q.cat] || 0) + 1; }
  for (const q of fresh){ if (pick.length >= n) break; if (!pick.includes(q)) pick.push(q); }
  if (pick.length < n){
    const rest = allQ().filter(q => allowed(q) && !pick.includes(q) && u.cards[q.id]).sort((a, b) => u.cards[a.id].box - u.cards[b.id].box || (u.cards[a.id].last < u.cards[b.id].last ? -1 : 1));
    for (const q of rest){ if (pick.length >= n) break; pick.push(q); }
  }
  return { date: t, track: u.track, ids: shuffle(pick, r).map(q => q.id), idx: 0, answers: [], started: Date.now(), reviewIds: pick.filter(q => u.cards[q.id]).map(q => q.id) };
}
function todaySession(u){
  if (!u.session || u.session.date !== today()) { u.session = buildDaily(u); persist(); }
  u.session.ids = u.session.ids.filter(id => qById(id));
  return u.session;
}

/* ───────── 채점·복습 ───────── */
function grade(q, val){
  if (q.type === "sata"){ const a = q.a.slice().sort().join(","), b = (val || []).slice().sort().join(","); return a === b; }
  if (q.type === "num"){ const v = parseFloat(String(val).replace(/,/g, "").trim()); return !isNaN(v) && Math.abs(v - q.a) <= (q.tol ?? 0) + 1e-9; }
  return val === q.a;
}
function schedule(u, id, ok, guessed){
  const c = u.cards[id] || (u.cards[id] = { box:0, due:today(), seen:0, right:0, wrong:0, last:null, streak:0 });
  c.seen++; c.last = today();
  if (ok){ c.right++; c.streak++; c.box = guessed ? Math.max(1, c.box) : Math.min(c.box + 1, INTERVALS.length - 1); }
  else { c.wrong++; c.streak = 0; c.box = 1; }
  c.due = addDays(today(), ok ? Math.max(1, INTERVALS[c.box]) : 1);
}
function addXp(u, n){ const before = levelOf(u.xp).lv; u.xp += n; const after = levelOf(u.xp); if (after.lv > before) setTimeout(() => toast(`레벨 업! Lv.${after.lv} ${after.title} 🎉`, 2600), 400); }
function markHist(u, ok, completeDaily){
  const t = today(); const h = u.hist[t] || (u.hist[t] = { n:0, ok:0, done:false, ms:0 });
  if (ok !== null){ h.n++; if (ok) h.ok++; }
  if (completeDaily){ h.tr = h.tr || {}; h.tr[u.track] = true; if (!h.done){ h.done = true; const s = streakOf(u); if (s > u.bestStreak) u.bestStreak = s; } }
}

    <h1>출근 전 3분,<br>응급실 감각 깨우기</h1>
    <div class="sub">하루 몇 문제씩. 틀린 문제는 1·3·7일 뒤 다시 나와서 오래 기억되도록 도와줘요. 해외 간호사 준비(NCLEX 기초)도 함께.</div>
  </div>
  <div class="card">
    <div class="seg" role="tablist">
      <button class="${login ? "on" : ""}" id="mLogin" role="tab" aria-selected="${login}">로그인</button>

    </div>

      ${login && ids.length ? `<div class="field"><label>이 기기의 계정</label><div style="display:flex;gap:6px;flex-wrap:wrap">${ids.map(i => `<button type="button" class="chip" data-pick="${esc(i)}">👤 ${esc(acc[i].nick || i)}</button>`).join("")}</div></div>` : ""}

      ${!login ? `<div class="field"><label for="anick">닉네임 (선택)</label><input class="input" id="anick" maxlength="12" placeholder="예: 3년차 ER 간호사"></div>` : ""}
      <div class="field"><label for="apw">비밀번호</label><input class="input" id="apw" type="password" autocomplete="${login ? "current-password" : "new-password"}" maxlength="40" placeholder="4자 이상"></div>
      ${!login ? `<div class="field"><label for="apw2">비밀번호 확인</label><input class="input" id="apw2" type="password" autocomplete="new-password" maxlength="40"></div>` : ""}

  </div>
  <p class="disc">학습용 앱입니다. 실제 투약·처치는 소속 기관의 프로토콜과 의사 처방을 우선하세요.</p>`;
  $("#mLogin").onclick = () => { authMode = "login"; renderAuth(); };
  $("#mSign").onclick = () => { authMode = "signup"; renderAuth(); };
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { $("#aid").value = b.dataset.pick; $("#apw").focus(); });
  $("#af").onsubmit = e => { e.preventDefault(); login ? doLogin() : doSignup(); };
}
function doSignup(){
  const id = $("#aid").value.trim().toLowerCase(), pw = $("#apw").value, pw2 = $("#apw2").value, nick = $("#anick").value.trim();
  const err = m => $("#aerr").textContent = m;
  if (!/^[a-z0-9_]{3,20}$/.test(id)) return err("아이디는 영문 소문자·숫자·_ 3~20자로 입력해 주세요.");
  if (pw.length < 4) return err("비밀번호는 4자 이상이어야 해요.");
  if (pw !== pw2) return err("비밀번호 확인이 일치하지 않아요.");
  const acc = load(LS_ACC, {});
  if (acc[id]) return err("이미 이 기기에 있는 아이디예요. 로그인해 주세요.");
  const salt = Math.random().toString(36).slice(2, 12);
  acc[id] = { salt, hash: sha256(salt + ":" + pw), nick: nick || id, created: today() };
  if (!save(LS_ACC, acc)) return;
  save(LS_U(id), newUser(id, nick || id));
  startSession(id, $("#keep").checked, true);
}
function doLogin(){
  const id = $("#aid").value.trim().toLowerCase(), pw = $("#apw").value;
  const a = load(LS_ACC, {})[id];
  if (!a || a.hash !== sha256(a.salt + ":" + pw)){ $("#aerr").textContent = "아이디 또는 비밀번호가 맞지 않아요."; $("#apw").value = ""; return; }
  startSession(id, $("#keep").checked, false);
}
function startSession(id, keep, isNew){
  S.user = migrate(load(LS_U(id), null) || newUser(id)); S.tab = "home"; S.quiz = null; authMode = null;
  if (keep) save(LS_SES, { id }); else localStorage.removeItem(LS_SES);
  sessionStorage.setItem("erh_live", id);
  persist(); requestPersist(); render();
  toast(isNew ? `환영해요, ${S.user.nick}님! 오늘 첫 세트를 시작해 볼까요?` : `${S.user.nick}님, 다시 오셨네요 👋`);
}
function logout(){ persist(); S.user = null; S.quiz = null; localStorage.removeItem(LS_SES); sessionStorage.removeItem("erh_live"); authMode = "login"; render(); }

/* ───────── 홈 ───────── */

    <div class="tip">${esc(tipQ.tip)}</div>

  <p class="disc">학습용 앱입니다. 실제 투약·처치는 소속 기관 프로토콜과 처방을 우선하세요.</p>`;

/* ───────── 퀴즈 ───────── */
function startQuiz(mode, ids, label){
  const u = S.user;
  if (mode === "daily"){
    const ses = todaySession(u);
    if (!ses.ids.length) return toast("이 트랙에 풀 문제가 없어요. 설정에서 분야를 확인해 주세요.");
    S.quiz = { mode, ids: ses.ids, idx: ses.answers.length, answers: ses.answers, label: "오늘의 한입 · " + TRACKS[u.track].name, started: Date.now() };
    if (S.quiz.idx >= S.quiz.ids.length) finishQuiz();
  } else {
    if (!ids || !ids.length) return toast("풀 문제가 없어요.");
    S.quiz = { mode, ids, idx: 0, answers: [], label: label || "연습", started: Date.now() };
  }
  S.quiz.state = null; S.quiz.order = null; render(); window.scrollTo(0, 0);
}
function renderQuiz(){
  const Z = S.quiz, u = S.user;
  if (Z.idx >= Z.ids.length) return renderResult();
  const q = curQ(); if (!q){ Z.idx++; return renderQuiz(); }
  const cat = CATS[q.cat];
  if (!Z.order || Z.order.id !== q.id){
    Z.order = { id:q.id, map: q.type !== "num" ? shuffle(q.opts.map((_, i) => i)) : null };
    Z.state = null; Z.sel = q.type === "sata" ? [] : null; Z.qStart = Date.now();
  }
  const st = Z.state; const pct = Math.round(Z.idx / Z.ids.length * 100);
  const bm = u.bookmarks.includes(q.id);
  const isReview = Z.mode === "daily" && (u.session?.reviewIds || []).includes(q.id);
  let body = "";
  if (q.type === "mc"){
    body = Z.order.map.map((oi, k) => {
      let cls = "";
      if (st){ if (oi === q.a) cls = "right"; else if (oi === Z.sel) cls = "wrong"; }
      else if (oi === Z.sel) cls = "sel";
      return `<button class="opt ${cls}" data-oi="${oi}" ${st ? "disabled" : ""} aria-label="${k + 1}번 보기"><span class="k">${st && oi === q.a ? "✓" : st && oi === Z.sel ? "✕" : k + 1}</span><span>${esc(q.opts[oi])}</span></button>`;
    }).join("");
  } else if (q.type === "sata"){
    body = Z.order.map.map(oi => {
      const on = Z.sel.includes(oi), right = q.a.includes(oi); let cls = "sq";
      if (st){ if (right) cls += " right"; else if (on) cls += " wrong"; } else if (on) cls += " sel";
      const mark = st ? (right ? (on ? "✓" : "!") : on ? "✕" : "") : on ? "✓" : "";
      return `<button class="opt ${cls}" data-oi="${oi}" ${st ? "disabled" : ""} aria-pressed="${on}"><span class="k">${mark}</span><span>${esc(q.opts[oi])}${st && right && !on ? ' <span class="small">(놓친 정답)</span>' : ""}</span></button>`;
    }).join("");
  } else {
    body = `<div class="numwrap"><input class="input" id="numIn" inputmode="decimal" autocomplete="off" placeholder="숫자 입력" value="${esc(Z.sel ?? "")}" ${st ? "disabled" : ""} aria-label="정답 숫자 입력"><span class="unit">${esc(q.unit || "")}</span></div>
      <p class="small">소수점은 문제에서 요구한 자리까지 입력하세요.${q.tol ? ` (허용 오차 ±${q.tol})` : ""}</p>`;
  }
  let fb = "";
  if (st){
    const ansTxt = q.type === "mc" ? q.opts[q.a] : q.type === "sata" ? q.a.map(i => q.opts[i]).join(" / ") : `${q.a}${q.unit ? " " + q.unit : ""}`;
    fb = `<div class="fb ${st.ok ? "fok" : "fno"}" id="fb">
      <div class="head">${st.ok ? "정답이에요 👏" : "아쉬워요 — 정답: " + esc(ansTxt)}</div>
      <div>${esc(q.exp)}</div>
      ${q.tip ? `<div class="pt"><b>🩺 ${trackOf(q.cat) === "gl" ? "학습" : "실무"} 포인트</b><br>${esc(q.tip)}</div>` : ""}
      <div class="src">기준: ${esc(q.src || "-")}${q.custom ? "" : " · 기관 프로토콜이 다르면 기관 기준을 따르세요."}</div>
      ${st.ok ? `<label class="toggle"><input type="checkbox" id="guess" ${st.guessed ? "checked" : ""}> 사실 찍어서 맞췄어요 (더 빨리 다시 출제)</label>` : ""}
    </div>`;
  }
  $("#app").innerHTML = `
  <div class="qtop"><button class="x" id="qx" aria-label="나가기">✕</button>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${st ? Math.round((Z.idx + 1) / Z.ids.length * 100) : pct}%"></i></div>
    <span class="small" style="min-width:42px;text-align:right">${Z.idx + 1}/${Z.ids.length}</span></div>
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div><span class="tag" style="background:${cat.color}">${cat.icon} ${cat.name}</span><span class="lv">${"●".repeat(q.lv || 1)}${"○".repeat(3 - (q.lv || 1))}</span>
    ${isReview ? `<span class="badge" style="margin-left:6px">복습</span>` : ""}${q.custom ? `<span class="badge" style="margin-left:6px">내 문제</span>` : ""}</div>
    <button class="linkbtn" id="bm" aria-pressed="${bm}" style="text-decoration:none;font-size:20px">${bm ? "★" : "☆"}</button>
  </div>
  <div class="qtext">${esc(q.q)}${q.type === "sata" ? ' <span class="badge">모두 고르시오</span>' : ""}</div>
  ${q.ecg ? ecgSvg(q.ecg, q.id) : ""}
  <div id="opts">${body}</div>
  ${fb}
  ${st ? `<div style="text-align:right"><button class="linkbtn" id="rep">문제 오류 신고/메모</button></div>` : ""}
  <div class="sticky"><button class="btn" id="qgo" ${!st && emptySel(Z.sel) ? "disabled" : ""}>${st ? (Z.idx + 1 >= Z.ids.length ? "결과 보기" : "다음 문제 →") : "정답 확인"}</button></div>`;

  $("#qx").onclick = () => confirmSheet(Z.mode === "daily" ? "지금 나가도 푼 문제까지 저장돼요. 나중에 이어서 풀 수 있어요." : "연습을 끝낼까요? 푼 문제는 기록에 반영됐어요.", "나가기", () => { S.quiz = null; render(); });
  $("#bm").onclick = () => { const i = u.bookmarks.indexOf(q.id); if (i >= 0) u.bookmarks.splice(i, 1); else u.bookmarks.push(q.id); persist(); toast(i >= 0 ? "북마크 해제" : "북마크에 저장했어요 ★"); renderQuiz(); };
  if (!st){
    if (q.type === "mc") document.querySelectorAll(".opt").forEach(b => b.onclick = () => { Z.sel = +b.dataset.oi; renderQuiz(); });
    else if (q.type === "sata") document.querySelectorAll(".opt").forEach(b => b.onclick = () => toggleSata(+b.dataset.oi));
    else { const inp = $("#numIn"); inp.oninput = () => { Z.sel = inp.value; $("#qgo").disabled = !inp.value.trim(); }; inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()){ e.preventDefault(); submitAnswer(); } }; setTimeout(() => inp.focus({ preventScroll:true }), 50); }
    $("#qgo").onclick = submitAnswer;
  } else {
    const g = $("#guess"); if (g) g.onchange = () => { st.guessed = g.checked; reschedule(q.id, true, g.checked); };
    $("#qgo").onclick = nextQ; $("#rep").onclick = () => reportSheet(q);
    setTimeout(() => { const f = $("#fb"); if (f && f.getBoundingClientRect().top > innerHeight * .6) f.scrollIntoView({ behavior:"smooth", block:"start" }); }, 60);
  }
}
function toggleSata(oi){ const Z = S.quiz; const i = Z.sel.indexOf(oi); if (i >= 0) Z.sel.splice(i, 1); else Z.sel.push(oi); renderQuiz(); }
let cardBackup = null;
function submitAnswer(){
  const Z = S.quiz, u = S.user, q = curQ();
  if (Z.state || emptySel(Z.sel)) return;
  if (q.type === "num" && isNaN(parseFloat(String(Z.sel).replace(/,/g, "")))) return toast("숫자로 입력해 주세요.");
  const ok = grade(q, Z.sel);
  cardBackup = JSON.parse(JSON.stringify(u.cards[q.id] || null));
  schedule(u, q.id, ok, false);
  addXp(u, ok ? 10 : 3);
  markHist(u, ok, false);
  Z.state = { ok, guessed:false };
  Z.answers.push({ id:q.id, ok, val:Array.isArray(Z.sel) ? Z.sel.slice() : Z.sel, ms: Date.now() - Z.qStart, inst: q.gen ? { q:q.q, a:q.a, unit:q.unit, exp:q.exp, tip:q.tip, tol:q.tol } : undefined });
  if (Z.mode === "daily") u.session.answers = Z.answers;
  persist(); vibrate(ok ? 15 : [30, 40, 30]); renderQuiz();
}
function reschedule(id, ok, guessed){
  const u = S.user;
  if (cardBackup) u.cards[id] = JSON.parse(JSON.stringify(cardBackup)); else delete u.cards[id];
  schedule(u, id, ok, guessed);
  persist(); toast(guessed ? "알겠어요. 내일 한 번 더 확인할게요." : "다시 정상 간격으로 복습할게요.");
}
function nextQ(){
  const Z = S.quiz; cardBackup = null; Z.idx++; Z.state = null; Z.sel = null; Z.order = null;
  if (Z.mode === "daily"){ S.user.session.idx = Z.idx; persist(); }
  if (Z.idx >= Z.ids.length) finishQuiz();
  renderQuiz(); window.scrollTo(0, 0);
}
function finishQuiz(){
  const Z = S.quiz, u = S.user;
  Z.ended = Date.now();
  if (Z.mode === "daily" && !u.hist[today()]?.tr?.[u.track]){
    markHist(u, null, true); u.hist[today()].ms = (u.hist[today()].ms || 0) + (Z.ended - Z.started);
    addXp(u, 20); Z.firstFinish = true;
  }
  persist();
}
function renderResult(){
  const Z = S.quiz, u = S.user;
  const n = Z.answers.length, ok = Z.answers.filter(a => a.ok).length;
  const pct = n ? Math.round(ok / n * 100) : 0;
  const st = streakOf(u);
  const wrongIds = Z.answers.filter(a => !a.ok).map(a => a.id);
  const msg = pct === 100 ? "완벽해요! 오늘도 이 감각 그대로 🙌" : pct >= 70 ? "좋아요! 틀린 문제는 내일 다시 나와요." : "괜찮아요. 틀린 문제가 제일 오래 남는 공부예요.";
  const sec = Math.round(((Z.ended || Date.now()) - Z.started) / 1000);

function sheet(html, onMount){
  const bg = document.createElement("div"); bg.className = "sheetbg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
  const close = () => bg.remove();
  const onKey = e => { if (e.key === "Escape"){ close(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);
  onMount && onMount(bg, close);
  return close;
}
