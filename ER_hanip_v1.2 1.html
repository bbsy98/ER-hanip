  </div>
  <div class="card mt"><h3>최근 12주</h3><div class="heat">${cells}</div>
    <div class="small" style="display:flex;gap:10px;margin-top:6px;align-items:center">일부 <i style="width:11px;height:11px;border-radius:3px;display:inline-block;background:color-mix(in srgb,var(--pri) 35%,var(--line))"></i> 완료 <i style="width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--pri)"></i></div></div>
  <div class="grouph" style="margin-top:18px">트랙별 기록</div>
  ${trackSeg()}
  <div class="stats3 mt">
    <div class="stat"><b>${trDone}</b><span>한입 완료</span></div>
    <div class="stat"><b>${seen}/${total}</b><span>풀어본 문제</span></div>
    <div class="stat"><b>${trN ? Math.round(trOk / trN * 100) : 0}%</b><span>정답률</span></div>
  </div>
  <div class="card mt"><h3>분야별 정답률</h3>
    ${tc.map(k => { const c = CATS[k], a = acc[k]; const p = a.n ? Math.round(a.ok / a.n * 100) : 0;
      return `<div class="catbar"><div class="h"><span>${c.icon} ${c.name}</span><span class="small">${a.n ? `${p}% (${a.ok}/${a.n})` : "아직 없음"}</span></div><div class="b"><i style="width:${p}%;background:${c.color}"></i></div></div>`; }).join("")}
  </div>
  <div class="card"><h3>기억 단계</h3>
    <p class="small">문제를 맞힐 때마다 다음 단계로 올라가고 복습 간격이 1 → 3 → 7 → 14 → 30일로 늘어나요. 4단계 이상이면 마스터!</p>
    ${[1,2,3,4,5,6].map(b => `<div class="catbar"><div class="h"><span>${b}단계 <span class="small">(${INTERVALS[b]}일 간격)</span></span><span class="small">${boxes[b]}문제</span></div><div class="b"><i style="width:${seen ? boxes[b] / seen * 100 : 0}%;background:var(--pri)"></i></div></div>`).join("")}
    <p class="small mt mb0">${TRACKS[u.track].name} ${total}문제 중 ${seen}문제를 풀어봤어요.</p>
  </div>`;
  bindTrackSeg();
}

/* ───────── 설정 ───────── */
function tcBtns(keys, s){ return keys.map(k => { const c = CATS[k], on = s.cats.includes(k); return `<button class="catbtn ${on ? "" : "off"}" data-tc="${k}" aria-pressed="${on}"><div class="n">${on ? "✓ " : ""}${c.icon} ${c.name}</div></button>`; }).join(""); }
function clearUnstarted(u, tr){ const ss = tr === u.track ? u.session : u.sessions[tr]; if (ss && ss.date === today() && !ss.answers.length){ if (tr === u.track) u.session = null; else u.sessions[tr] = null; } }
function renderSettings(){
  const u = S.user, s = u.settings;
  const snaps = load(LS_SNAP(u.id), []);
  $("#app").innerHTML = `
  <div class="top"><div class="brand">⚙️ 설정</div><span class="chip">👤 ${esc(u.nick)}</span></div>
  <div class="card"><h3>하루 문제 수</h3>
    <div class="seg">${[3,5,7,10].map(n => `<button class="${s.daily === n ? "on" : ""}" data-daily="${n}">${n}문제</button>`).join("")}</div>
    <p class="small mb0">이미 시작한 오늘 세트는 그대로 두고, 시작 전 세트와 내일부터 적용돼요.</p></div>
  <div class="card"><h3>오늘의 한입 출제 분야</h3>
    <p class="small">응급실과 해외 준비는 <b>각각 따로</b> 오늘의 한입이 나와요(홈에서 트랙 전환). 트랙마다 최소 1개 분야는 켜져 있어야 해요.</p>
    <div class="grouph">🚑 응급실 실무</div><div class="catgrid">${tcBtns(ER_CATS, s)}</div>
    <div class="grouph">🌏 해외 간호사 준비</div><div class="catgrid">${tcBtns(GL_CATS, s)}</div></div>
  <div class="card"><h3>화면</h3>
    <div class="seg">${[["auto","시스템"],["light","라이트"],["dark","다크"]].map(([k, l]) => `<button class="${s.theme === k ? "on" : ""}" data-th="${k}">${l}</button>`).join("")}</div>
    <label class="toggle"><input type="checkbox" id="hap" ${s.haptic ? "checked" : ""}> 정답/오답 진동 (지원 기기)</label>
    <div class="field mt"><label for="nick">닉네임</label><div class="row"><input class="input" id="nick" maxlength="12" value="${esc(u.nick)}"><button class="btn sm" id="nickOk" style="flex:0 0 auto">변경</button></div></div></div>
  <div class="card"><h3>기록 보호 · 백업</h3>
    <p class="small">기록은 이 기기 브라우저에 저장되고, 새 버전 파일로 바꿔도 <b>같은 위치(같은 사이트/같은 파일 경로)</b>에서 열면 그대로 유지돼요. 휴대폰 교체·브라우저 데이터 삭제에 대비해 백업 파일도 저장해 두세요.</p>
    <div class="row"><button class="btn soft" id="bk">백업 파일 저장</button><button class="btn ghost" id="rs">백업 불러오기</button></div>
    <input type="file" id="rsf" accept=".json,application/json" hidden>
    <p class="small mt">마지막 백업: ${u.lastBackup || "없음"} · 저장소 보호: <span id="pst">확인 중…</span></p>
    <div class="grouph">이 기기 자동 스냅샷 (하루 1번, 최근 7일)</div>
    ${snaps.length ? snaps.map((x, i) => `<div class="li"><div class="t"><div>${x.date} <span class="small">v${esc(x.ver)}</span></div><span class="small">${x.n}문제 기록</span></div><button class="btn sm ghost" data-snap="${i}">되돌리기</button></div>`).join("") : `<p class="small mb0">아직 스냅샷이 없어요.</p>`}
    ${u.reports.length ? `<p class="small mt mb0">검수 메모 ${u.reports.length}개가 백업 파일에 함께 저장돼요.</p>` : ""}</div>
  <div class="card"><h3>홈 화면에 추가</h3>
    <p class="small mb0">아이폰: Safari 공유 버튼 → <b>홈 화면에 추가</b><br>안드로이드: Chrome 메뉴(⋮) → <b>홈 화면에 추가</b><br>앱처럼 아이콘으로 바로 열려요.</p></div>
  <div class="card"><h3>계정</h3>
    <div class="row"><button class="btn ghost" id="pwc">비밀번호 변경</button><button class="btn ghost" id="lo">로그아웃</button></div>
    <button class="btn danger mt" id="rst">학습 기록 초기화</button>
    <button class="linkbtn mt" id="delAcc">이 기기에서 계정 삭제</button></div>
  <p class="disc">ER 한입 v${APP_VER} · 응급실 ${BANK.filter(q => trackOf(q.cat) === "er").length}문제 + 해외 준비 ${BANK.filter(q => trackOf(q.cat) === "gl").length}문제 (변형 계산 ${BANK.filter(q => q.gen).length}종 포함)<br>해외 준비 가이드는 ${GUIDE.checked} 기준 정보로, 공식 기관에서 최신 요건을 꼭 확인하세요. 문제는 AHA 2025 지침, KTAS, SSC, NCLEX 시험계획 등 공개 자료를 바탕으로 작성한 학습용 자료예요. 약물 농도·용량·프로토콜은 기관마다 다를 수 있으니 실제 업무에서는 소속 기관 기준과 처방을 따르세요.</p>`;
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(v => { const e = $("#pst"); if (e) e.textContent = v ? "켜짐 ✓" : "브라우저 기본"; }).catch(() => {}); else { const e = $("#pst"); if (e) e.textContent = "지원 안 함"; }
  document.querySelectorAll("[data-daily]").forEach(b => b.onclick = () => {
    s.daily = +b.dataset.daily; Object.keys(TRACKS).forEach(tr => clearUnstarted(u, tr));
    persist(); renderSettings(); toast(`하루 ${s.daily}문제로 설정했어요. (시작한 세트는 그대로 유지)`);
  });
  document.querySelectorAll("[data-tc]").forEach(b => b.onclick = () => {
    const k = b.dataset.tc, i = s.cats.indexOf(k), tr = trackOf(k), grp = tr === "gl" ? GL_CATS : ER_CATS;
    if (i >= 0){ if (s.cats.filter(c => grp.includes(c)).length === 1) return toast("트랙마다 최소 1개 분야는 선택해야 해요."); s.cats.splice(i, 1); } else s.cats.push(k);
    clearUnstarted(u, tr); persist(); renderSettings();
  });
  document.querySelectorAll("[data-snap]").forEach(b => b.onclick = () => {
    const sn = load(LS_SNAP(u.id), [])[+b.dataset.snap]; if (!sn) return;
    confirmSheet(`${sn.date} 상태로 되돌릴까요? 현재 기록은 되돌리기 직전 스냅샷으로 따로 저장돼요.`, "되돌리기", () => {
      autoSnapshot(u, true); S.user = migrate(JSON.parse(JSON.stringify(sn.user))); save(LS_U(u.id), S.user); render(); toast(`${sn.date} 기록으로 되돌렸어요.`);
    });
  });
  document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { s.theme = b.dataset.th; persist(); render(); });
  $("#hap").onchange = e => { s.haptic = e.target.checked; persist(); };
  $("#nickOk").onclick = () => { const v = $("#nick").value.trim(); if (!v) return toast("닉네임을 입력해 주세요."); u.nick = v; const acc = load(LS_ACC, {}); if (acc[u.id]){ acc[u.id].nick = v; save(LS_ACC, acc); } persist(); renderSettings(); toast("닉네임을 바꿨어요."); };
  $("#bk").onclick = exportBackup;
  $("#rs").onclick = () => $("#rsf").click();
  $("#rsf").onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ""; };
  $("#lo").onclick = () => confirmSheet("로그아웃할까요?", "로그아웃", logout);
  $("#pwc").onclick = changePw;
  $("#rst").onclick = () => confirmSheet("학습 기록(정답 기록, 연속 일수, XP, 복습 일정)을 모두 지울까요? 내 문제와 북마크는 남고, 초기화 직전 상태는 자동 스냅샷에 보관돼요.", "초기화", () => { autoSnapshot(u, true); Object.assign(u, { cards:{}, hist:{}, xp:0, session:null, sessions:{}, bestStreak:0 }); persist(); go("home"); toast("초기화했어요."); }, true);
  $("#delAcc").onclick = () => confirmSheet(`'${u.id}' 계정과 모든 기록을 이 기기에서 삭제할까요? 되돌릴 수 없어요.`, "삭제", () => { const acc = load(LS_ACC, {}); delete acc[u.id]; save(LS_ACC, acc); localStorage.removeItem(LS_U(u.id)); localStorage.removeItem(LS_SNAP(u.id)); S.user = null; localStorage.removeItem(LS_SES); authMode = null; render(); toast("계정을 삭제했어요."); }, true);
}
function changePw(){
  sheet(`<h2>비밀번호 변경</h2>
    <div class="field"><label>현재 비밀번호</label><input class="input" type="password" id="p0" autocomplete="current-password"></div>
    <div class="field"><label>새 비밀번호 (4자 이상)</label><input class="input" type="password" id="p1" autocomplete="new-password"></div>
    <div class="err" id="pErr"></div>
    <div class="row"><button class="btn ghost" id="pNo">취소</button><button class="btn" id="pOk">변경</button></div>`,
  (bg, close) => {
    bg.querySelector("#pNo").onclick = close;
    bg.querySelector("#pOk").onclick = () => {
      const acc = load(LS_ACC, {}), a = acc[S.user.id], p0 = bg.querySelector("#p0").value, p1 = bg.querySelector("#p1").value;
      if (!a || a.hash !== sha256(a.salt + ":" + p0)) return bg.querySelector("#pErr").textContent = "현재 비밀번호가 맞지 않아요.";
      if (p1.length < 4) return bg.querySelector("#pErr").textContent = "새 비밀번호는 4자 이상이어야 해요.";
      a.salt = Math.random().toString(36).slice(2, 12); a.hash = sha256(a.salt + ":" + p1); save(LS_ACC, acc); close(); toast("비밀번호를 변경했어요.");
    };
  });
}
function exportBackup(){
  const acc = load(LS_ACC, {})[S.user.id];
  S.user.lastBackup = today(); persist();
  const data = { app:"ER한입", ver:APP_VER, exported:new Date().toISOString(), account:{ id:S.user.id, ...acc }, user:S.user };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ER한입_백업_${S.user.id}_${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("백업 파일을 저장했어요.");
}
function mergeUsers(cur, inc){
  const m = JSON.parse(JSON.stringify(cur));
  for (const id in inc.cards || {}){ const a = m.cards[id], b = inc.cards[id];
    if (!a) m.cards[id] = b;
    else if ((b.last || "") > (a.last || "")) m.cards[id] = Object.assign({}, b, { seen:Math.max(a.seen, b.seen), right:Math.max(a.right, b.right), wrong:Math.max(a.wrong, b.wrong) });
    else Object.assign(a, { seen:Math.max(a.seen, b.seen), right:Math.max(a.right, b.right), wrong:Math.max(a.wrong, b.wrong) }); }
  for (const d in inc.hist || {}){ const a = m.hist[d], b = inc.hist[d];
    if (!a) m.hist[d] = b; else { a.n = Math.max(a.n, b.n); a.ok = Math.max(a.ok, b.ok); a.done = a.done || b.done; a.tr = Object.assign({}, b.tr || {}, a.tr || {}); a.ms = Math.max(a.ms || 0, b.ms || 0); } }
  m.xp = Math.max(m.xp || 0, inc.xp || 0); m.bestStreak = Math.max(m.bestStreak || 0, inc.bestStreak || 0);
  m.bookmarks = [...new Set([...(m.bookmarks || []), ...(inc.bookmarks || [])])];
  const ids = new Set((m.custom || []).map(c => c.id)); (inc.custom || []).forEach(c => { if (!ids.has(c.id)) m.custom.push(c); });
  const rk = new Set((m.reports || []).map(r => r.id + r.text)); (inc.reports || []).forEach(r => { if (!rk.has(r.id + r.text)) m.reports.push(r); });
  return m;
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = () => {
    let d; try { d = JSON.parse(fr.result); } catch(e){ return toast("백업 파일을 읽을 수 없어요."); }
    if (d.app !== "ER한입" || !d.user || !d.user.id) return toast("ER 한입 백업 파일이 아니에요.");
    const days = Object.keys(d.user.hist || {}).length, same = d.user.id === S.user.id;
    const applyAcc = () => { const acc = load(LS_ACC, {});
      if (d.account && d.account.hash){ if (!acc[d.user.id]) acc[d.user.id] = { salt:d.account.salt, hash:d.account.hash, nick:d.account.nick || d.user.nick, created:d.account.created || today() }; }
      else if (!acc[d.user.id]){ toast("백업에 계정 정보가 없어 불러올 수 없어요."); return false; }
      save(LS_ACC, acc); return true; };
    sheet(`<h2>백업 불러오기</h2><p>'${esc(d.user.id)}' 계정 · ${days}일 기록 · v${esc(d.ver || "?")}</p>
      <p class="small"><b>합치기(추천)</b>: 지금 기록과 백업 기록을 모두 살려 합쳐요. 어느 쪽 기록도 지워지지 않아요.<br><b>덮어쓰기</b>: 백업 내용으로 바꿔요(현재 상태는 스냅샷에 보관).</p>
      <button class="btn" id="imM">합치기</button><button class="btn ghost mt" id="imO">덮어쓰기</button><button class="btn ghost mt" id="imC">취소</button>`, (bg, close) => {
      bg.querySelector("#imC").onclick = close;
      const run = merge => { close(); if (!applyAcc()) return;
        const existing = same ? S.user : load(LS_U(d.user.id), null);
        if (existing) autoSnapshot(migrate(JSON.parse(JSON.stringify(existing))), true);
        const incoming = migrate(JSON.parse(JSON.stringify(d.user)));
        const result = merge && existing ? mergeUsers(migrate(JSON.parse(JSON.stringify(existing))), incoming) : incoming;
        save(LS_U(d.user.id), migrate(result));
        if (same){ S.user = migrate(load(LS_U(d.user.id))); render(); toast(merge ? "기록을 합쳤어요." : "백업으로 바꿨어요."); }
        else toast(`'${d.user.id}' 계정을 ${existing ? (merge ? "합쳤어요" : "덮어썼어요") : "추가했어요"}. 로그아웃 후 해당 계정으로 로그인하세요.`, 3000);
      };
      bg.querySelector("#imM").onclick = () => run(true); bg.querySelector("#imO").onclick = () => run(false);
    });
  };
  fr.readAsText(file);
}

/* ───────── 키보드 (PC) ───────── */
document.addEventListener("keydown", e => {
  if (!S.quiz || document.querySelector(".sheetbg")) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const Z = S.quiz; if (Z.idx >= Z.ids.length) return; const q = curQ(); if (!q) return;
  if (!Z.state && q.type !== "num" && /^[1-9]$/.test(e.key)){ const oi = Z.order?.map[+e.key - 1]; if (oi !== undefined){ if (q.type === "sata") toggleSata(oi); else { Z.sel = oi; renderQuiz(); } } }
  else if (e.key === "Enter"){ e.preventDefault(); if (Z.state) nextQ(); else submitAnswer(); }
});

/* ───────── 시작 ───────── */
(function boot(){
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
  const ses = load(LS_SES, null), live = sessionStorage.getItem("erh_live");
  const id = ses?.id || live;
  if (id && load(LS_ACC, {})[id]){ S.user = migrate(load(LS_U(id), null) || newUser(id)); save(LS_U(id), S.user); requestPersist(); }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.user && !S.quiz && S.user.session && S.user.session.date !== today()) render(); });
  render();
})();
</script>
